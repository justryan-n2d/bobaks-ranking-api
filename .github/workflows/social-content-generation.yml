name: Generate social content

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate social posts
        env:
          BOBAKS_API_ORIGIN: https://bobaks-ranking-api-service.ryan-oledan0.workers.dev
          SOCIAL_OUTPUT_DIR: social-output
        run: node scripts/generate-social-posts.mjs

      - name: Upload social content
        uses: actions/upload-artifact@v4
        with:
          name: bobaks-social-content
          path: social-output/
          if-no-files-found: error
          retention-days: 14
