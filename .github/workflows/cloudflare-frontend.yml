name: Deploy Cloudflare Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src/frontend-worker.ts"
      - "src/admin-analytics.ts"
      - "test/frontend.test.mjs"
      - "test/frontend-worker.test.ts"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run frontend verification
        run: npm run test:frontend

      - name: Sync Worker analytics secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler versions secret put CLOUDFLARE_ACCOUNT_ID --config wrangler.jsonc
          printf '%s' "$CLOUDFLARE_ANALYTICS_API_TOKEN" | npx wrangler versions secret put CLOUDFLARE_ANALYTICS_API_TOKEN --config wrangler.jsonc
          if [ -n "$CF_ACCESS_TEAM_DOMAIN" ]; then
            printf '%s' "$CF_ACCESS_TEAM_DOMAIN" | npx wrangler versions secret put CF_ACCESS_TEAM_DOMAIN --config wrangler.jsonc
          fi
          if [ -n "$CF_ACCESS_AUD" ]; then
            printf '%s' "$CF_ACCESS_AUD" | npx wrangler versions secret put CF_ACCESS_AUD --config wrangler.jsonc
          fi

      - name: Version frontend assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA::12}"
          sed -i "s|/app.js</script>|/app.js?v=${VERSION}</script>|" frontend/index.html

      - name: Deploy frontend Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test published frontend
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND="https://bobaks-ranking-api.ryan-oledan0.workers.dev"
          API="https://bobaks-ranking-api-service.ryan-oledan0.workers.dev"

          html=$(curl -fsS "$FRONTEND")
          app_path=$(printf "%s\n" "$html" | sed -n 's|.*<script src="\([^"]*app\.js[^"]*\)"></script>.*|\1|p' | head -n 1)
          test -n "$app_path"
          app_js=$(curl -fsS "$FRONTEND$app_path")
          echo "$app_js" | grep -F "const API='/api'"
          echo "$app_js" | grep -F "function loadRankings"
          echo "$app_js" | grep -F "ensureQrCode"
          echo "$app_js" | grep -F "__BOBAKS_RANKING_SNAPSHOT__"
          ! echo "$html" | grep -F "bobaks-api-production.up.railway.app"
          echo "$html" | grep -F "<title>Bobaks Ranking |"
          echo "$html" | grep -F 'id="app"'

          health=$(curl -fsS "$API/api/health")
          echo "$health" | jq -e '.ok == true' >/dev/null

          games=$(curl -fsS "$API/api/games")
          game_id=$(echo "$games" | jq -r '.data[0].id')
          test -n "$game_id"
          test "$game_id" != "null"

          rankings=$(curl -fsS "$API/api/rankings?period=live")
          echo "$rankings" | jq -e '.period == "live" and (.data | length > 0)' >/dev/null

          proxied_rankings=$(curl -fsS "$FRONTEND/api/rankings?period=live")
          echo "$proxied_rankings" | jq -e '.period == "live" and (.data | length > 0)' >/dev/null

          weekly=$(curl -fsS "$FRONTEND/rankings/weekly")
          echo "$weekly" | grep -F "This Week's Roblox Game Rankings | Bobaks Ranking"
          echo "$weekly" | grep -F 'rel="canonical" href="https://bobaks-ranking-api.ryan-oledan0.workers.dev/rankings/weekly"'

          game_html=$(curl -fsS "$FRONTEND/game/$game_id")
          echo "$game_html" | grep -F "| Bobaks Ranking"
          ! echo "$game_html" | grep -F "Game not found"

          sitemap=$(curl -fsS "$FRONTEND/sitemap.xml?smoke=1")
          sitemap_urls=$(echo "$sitemap" | grep -o "<loc>" | wc -l)
          test "$sitemap_urls" -gt 0
          echo "$sitemap" | grep -F "$FRONTEND/game/$game_id"

          echo "Published frontend and Cloudflare API smoke test passed."
