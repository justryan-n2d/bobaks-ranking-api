name: Bobaks Restore Drill

on:
  push:
    branches:
      - ops/real-restore-recovery-20261005
  workflow_dispatch:
    inputs:
      object_key:
        description: "Encrypted B2 backup object key to restore"
        required: true
        type: string

env:
  VALIDATION_OBJECT_KEY: weekly/2026/10/2026-10-05/bobaks-public-20261005T104214Z.dump.enc

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOBAKS_B2_REGION: ${{ secrets.BOBAKS_B2_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.BOBAKS_B2_REGION }}
      BOBAKS_B2_BUCKET: ${{ secrets.BOBAKS_B2_BUCKET }}
      BOBAKS_B2_ACCESS_KEY_ID: ${{ secrets.BOBAKS_B2_ACCESS_KEY_ID }}
      BOBAKS_B2_SECRET_ACCESS_KEY: ${{ secrets.BOBAKS_B2_SECRET_ACCESS_KEY }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      RESTORE_DB_URL: ${{ secrets.RESTORE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x /usr/lib/postgresql/17/bin/pg_restore ]]; then
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
            sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb deb-src
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Architectures: amd64
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
          printf 'PATH=/usr/lib/postgresql/17/bin:%s\\n' "${PATH}" >> "${GITHUB_ENV}"

      - name: Verify PostgreSQL 17 client tools
        shell: bash
        run: |
          set -euo pipefail
          pg_restore_version="$("/usr/lib/postgresql/17/bin/pg_restore" --version)"
          echo "${pg_restore_version}"
          grep -Eq ' 17(\.|$)' <<< "${pg_restore_version}"

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y awscli
          fi

      - name: Validate restore configuration
        shell: bash
        env:
          OBJECT_KEY: ${{ inputs.object_key || env.VALIDATION_OBJECT_KEY }}
        run: |
          set -euo pipefail
          test -n "${OBJECT_KEY}"
          test -n "${BOBAKS_B2_REGION}" || { echo "Missing BOBAKS_B2_REGION"; exit 1; }
          test -n "${BOBAKS_B2_BUCKET}" || { echo "Missing BOBAKS_B2_BUCKET"; exit 1; }
          test -n "${BOBAKS_B2_ACCESS_KEY_ID}" || { echo "Missing BOBAKS_B2_ACCESS_KEY_ID"; exit 1; }
          test -n "${BOBAKS_B2_SECRET_ACCESS_KEY}" || { echo "Missing BOBAKS_B2_SECRET_ACCESS_KEY"; exit 1; }
          test -n "${BACKUP_ENCRYPTION_KEY}" || { echo "Missing BACKUP_ENCRYPTION_KEY"; exit 1; }
          test -n "${RESTORE_DB_URL}" || { echo "Missing repository Actions secret: RESTORE_DB_URL"; exit 1; }

      - name: Restore backup into isolated target
        env:
          OBJECT_KEY: ${{ inputs.object_key || env.VALIDATION_OBJECT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/restore-backup.sh "${OBJECT_KEY}"

      - name: Report restore drill success
        run: echo "Bobaks restore drill completed successfully."
