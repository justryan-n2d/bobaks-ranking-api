name: Production Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production Cloudflare API data
        run: |
          set -euo pipefail

          API="https://bobaks-ranking-api-service.bobaksranking.workers.dev"

          for i in $(seq 1 24); do
            health=$(curl -fsS "$API/api/health" || true)
            games=$(curl -fsS "$API/api/games" || true)
            live=$(curl -fsS "$API/api/rankings/live" || true)
            weekly=$(curl -fsS "$API/api/rankings/weekly" || true)
            monthly=$(curl -fsS "$API/api/rankings/monthly" || true)
            yearly=$(curl -fsS "$API/api/rankings/yearly" || true)

            if echo "$health" | jq -e '.ok == true and .database == "connected"' >/dev/null 2>&1 &&
               echo "$games" | jq -e '.data | length > 0' >/dev/null 2>&1 &&
               echo "$live" | jq -e '.data | length > 0' >/dev/null 2>&1 &&
               echo "$weekly" | jq -e '.data | length > 0' >/dev/null 2>&1 &&
               echo "$monthly" | jq -e '.data | length > 0' >/dev/null 2>&1 &&
               echo "$yearly" | jq -e '.data | length > 0' >/dev/null 2>&1; then
              echo "Cloudflare API is returning real database-backed game and ranking data."
              exit 0
            fi

            echo "Cloudflare API data not ready yet (attempt $i/24). Retrying in 10s..."
            sleep 10
          done

          echo "Cloudflare API did not return usable game/ranking data within 4 minutes."
          exit 1
