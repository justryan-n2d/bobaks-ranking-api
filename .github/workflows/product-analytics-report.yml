name: Product analytics report

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check analytics credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_ANALYTICS_API_TOKEN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Product analytics reporting skipped: Cloudflare analytics read credentials are not configured yet."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify report logic
        run: npm test

      - name: Generate 7-day product analytics report
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          ANALYTICS_REPORT_HOURS: "168"
          ANALYTICS_OUTPUT_FILE: "product-analytics-report.json"
        run: node scripts/product-analytics-report.mjs

      - name: Upload report
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bobaks-product-analytics-report
          path: product-analytics-report.json
          if-no-files-found: error
          retention-days: 30
