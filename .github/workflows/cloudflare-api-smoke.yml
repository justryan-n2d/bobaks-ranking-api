name: Cloudflare API Smoke Test

on:
  workflow_run:
    workflows: ["Deploy Cloudflare API"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public API
        shell: bash
        run: |
          set -euo pipefail

          API="https://bobaks-ranking-api-service.ryan-oledan0.workers.dev"

          health=$(curl -fsS "$API/api/health")
          echo "$health" | jq -e '.ok == true and .database == "connected"' >/dev/null

          games=$(curl -fsS "$API/api/games")
          echo "$games" | jq -e '.data | length > 0' >/dev/null

          game_id=$(echo "$games" | jq -r '.data[0].id')
          test -n "$game_id"
          test "$game_id" != "null"

          curl -fsS "$API/api/rankings?period=live" | jq -e '.period == "live" and (.data | length > 0)' >/dev/null
          curl -fsS "$API/api/rankings?period=week" | jq -e '.period == "week" and (.data | length > 0)' >/dev/null
          curl -fsS "$API/api/rankings?period=month" | jq -e '.period == "month" and (.data | length > 0)' >/dev/null
          curl -fsS "$API/api/rankings?period=year" | jq -e '.period == "year" and (.data | length > 0)' >/dev/null

          methodology=$(curl -fsS "$API/api/rankings/methodology")
          echo "$methodology" | jq -e '.methodologyVersion == "2026-09-28" and (.eligibility.live | contains("15 minutes")) and .eligibility.weekly.minimumSamples == 12 and .eligibility.weekly.minimumCoverage == 0.5 and .eligibility.monthly.minimumSamples == 12 and .eligibility.monthly.minimumCoverage == 0.5' >/dev/null

          audit=$(curl -fsS "$API/api/rankings/audit")
          echo "$audit" | jq -e '.auditStatus == "passed" and .rankings.live.rows == 100 and .rankings.weekly.rows == 100 and .rankings.monthly.rows == 100 and .rankings.yearly.rows == 100' >/dev/null

          curl -fsS "$API/api/games/$game_id" | jq -e '.data.id != null' >/dev/null
          history365=$(curl -fsS "$API/api/games/$game_id/history?days=365")
          echo "$history365" | jq -e --arg gameId "$game_id" '.gameId == $gameId and .days == 365 and (.resolution == "snapshot" or .resolution == "mixed" or .resolution == "daily")' >/dev/null
          echo "$history365" | jq -e '.data | length > 0' >/dev/null

          rank_history=$(curl -fsS "$API/api/games/$game_id/rank-history?days=31")
          echo "$rank_history" | jq -e --arg gameId "$game_id" '.gameId == $gameId and .days == 31 and (.data | type == "array")' >/dev/null

          curl -fsS "$API/api/games/$game_id/peak" | jq -e '.data.gameId != null' >/dev/null

          query=$(echo "$games" | jq -r '.data[0].name')
          curl -fsS --get --data-urlencode "q=$query" "$API/api/search" | jq -e '.data | length > 0' >/dev/null

          echo "Cloudflare API Worker smoke test passed."
