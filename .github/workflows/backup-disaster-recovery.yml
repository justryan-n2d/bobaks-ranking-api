name: Bobaks Backup and Disaster Recovery

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bobaks-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_DEFAULT_REGION: ${{ secrets.BOBAKS_B2_REGION }}
      SUPABASE_DB_HOST: aws-0-ap-southeast-1.pooler.supabase.com
      SUPABASE_DB_PORT: "5432"
      SUPABASE_DB_NAME: postgres
      SUPABASE_DB_USER: postgres.zhrfozouzvxhpkylmpwh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          if [[ ! -x /usr/lib/postgresql/17/bin/pg_dump ]]; then
            printf 'y\n' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
          export PATH="/usr/lib/postgresql/17/bin:${PATH}"
          pg_dump --version
          pg_restore --version
          psql --version

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y awscli
          fi

      - name: Check backup configuration
        id: config
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BOBAKS_B2_ENDPOINT: ${{ secrets.BOBAKS_B2_ENDPOINT }}
          BOBAKS_B2_BUCKET: ${{ secrets.BOBAKS_B2_BUCKET }}
          BOBAKS_B2_ACCESS_KEY_ID: ${{ secrets.BOBAKS_B2_ACCESS_KEY_ID }}
          BOBAKS_B2_SECRET_ACCESS_KEY: ${{ secrets.BOBAKS_B2_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          values=(
            "${SUPABASE_DB_PASSWORD}"
            "${BOBAKS_B2_ENDPOINT}"
            "${BOBAKS_B2_BUCKET}"
            "${BOBAKS_B2_ACCESS_KEY_ID}"
            "${BOBAKS_B2_SECRET_ACCESS_KEY}"
            "${BACKUP_ENCRYPTION_KEY}"
          )

          present=0
          missing=0
          for value in "${values[@]}"; do
            if [[ -n "${value}" ]]; then
              present=$((present + 1))
            else
              missing=$((missing + 1))
            fi
          done

          if [[ "${present}" -eq 0 ]]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            {
              echo "## Bobaks backup skipped"
              echo
              echo "B2 backup storage is not configured yet. No backup was attempted."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ "${missing}" -ne 0 ]]; then
            echo "Backup configuration is incomplete." >&2
            test -n "${SUPABASE_DB_PASSWORD}" || { echo "Missing GitHub secret: SUPABASE_DB_PASSWORD" >&2; exit 1; }
            test -n "${BOBAKS_B2_ENDPOINT}" || { echo "Missing GitHub secret: BOBAKS_B2_ENDPOINT" >&2; exit 1; }
            test -n "${BOBAKS_B2_BUCKET}" || { echo "Missing GitHub secret: BOBAKS_B2_BUCKET" >&2; exit 1; }
            test -n "${BOBAKS_B2_ACCESS_KEY_ID}" || { echo "Missing GitHub secret: BOBAKS_B2_ACCESS_KEY_ID" >&2; exit 1; }
            test -n "${BOBAKS_B2_SECRET_ACCESS_KEY}" || { echo "Missing GitHub secret: BOBAKS_B2_SECRET_ACCESS_KEY" >&2; exit 1; }
            test -n "${BACKUP_ENCRYPTION_KEY}" || { echo "Missing GitHub secret: BACKUP_ENCRYPTION_KEY" >&2; exit 1; }
          fi

          echo "configured=true" >> "${GITHUB_OUTPUT}"

      - name: Normalize B2 endpoint
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          BOBAKS_B2_ENDPOINT: ${{ secrets.BOBAKS_B2_ENDPOINT }}
        run: |
          set -euo pipefail

          endpoint="${BOBAKS_B2_ENDPOINT%/}"

          case "${endpoint}" in
            https://*)
              ;;
            http://*)
              echo "Backblaze B2 S3 endpoint must use HTTPS." >&2
              exit 1
              ;;
            *)
              endpoint="https://${endpoint}"
              ;;
          esac

          if [[ "${endpoint}" != https://* ]]; then
            echo "Invalid Backblaze B2 endpoint." >&2
            exit 1
          fi

          printf 'B2_ENDPOINT=%s\n' "${endpoint}" >> "${GITHUB_ENV}"

      - name: Verify Supabase database connection
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          PGHOST: ${{ env.SUPABASE_DB_HOST }}
          PGPORT: ${{ env.SUPABASE_DB_PORT }}
          PGDATABASE: ${{ env.SUPABASE_DB_NAME }}
          PGUSER: ${{ env.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
          PGAPPNAME: bobaks-backup
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if psql --no-psqlrc -v ON_ERROR_STOP=1 -Atqc "select current_user, current_database();" ; then
              echo "Supabase database connection verified."
              exit 0
            fi

            if [[ "${attempt}" -lt 5 ]]; then
              echo "Supabase connection attempt ${attempt}/5 failed; retrying in 15 seconds." >&2
              sleep 15
            fi
          done

          echo "Supabase database connection could not be established after 5 attempts." >&2
          exit 1

      - name: Create encrypted logical backup
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          PGHOST: ${{ env.SUPABASE_DB_HOST }}
          PGPORT: ${{ env.SUPABASE_DB_PORT }}
          PGDATABASE: ${{ env.SUPABASE_DB_NAME }}
          PGUSER: ${{ env.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
          PGAPPNAME: bobaks-backup
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          export PGCONNECT_TIMEOUT=30

          TIMESTAMP="$(date -u '+%Y%m%dT%H%M%SZ')"
          DATE_UTC="$(date -u '+%Y-%m-%d')"
          YEAR_UTC="$(date -u '+%Y')"
          MONTH_UTC="$(date -u '+%m')"
          DAY_UTC="$(date -u '+%d')"
          DUMP="bobaks-public-${TIMESTAMP}.dump"
          ENCRYPTED="${DUMP}.enc"

          pg_dump \
            --format=custom \
            --compress=6 \
            --schema=public \
            --no-owner \
            --no-acl \
            --file="${DUMP}"

          openssl enc \
            -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 310000 \
            -in "${DUMP}" \
            -out "${ENCRYPTED}" \
            -pass env:BACKUP_ENCRYPTION_KEY

          SHA256="$(sha256sum "${ENCRYPTED}" | awk '{print $1}')"

          printf '%s\n' "${TIMESTAMP}" > backup-timestamp.txt
          printf '%s\n' "${DATE_UTC}" > backup-date.txt
          printf '%s\n' "${DUMP}" > backup-dump.txt
          printf '%s\n' "${ENCRYPTED}" > backup-encrypted.txt
          printf '%s\n' "${SHA256}" > backup-sha256.txt
          printf '%s\n' "${YEAR_UTC}" > backup-year.txt
          printf '%s\n' "${MONTH_UTC}" > backup-month.txt
          printf '%s\n' "${DAY_UTC}" > backup-day.txt

          cat > manifest.json <<EOF
          {
            "service": "bobaks-ranking",
            "type": "logical-public-schema-backup",
            "format": "postgres-custom",
            "encrypted": true,
            "cipher": "aes-256-cbc",
            "keyDerivation": "pbkdf2",
            "timestampUtc": "${TIMESTAMP}",
            "dateUtc": "${DATE_UTC}",
            "gitCommit": "${GITHUB_SHA}",
            "encryptedFile": "${ENCRYPTED}",
            "sha256": "${SHA256}"
          }
          EOF

      - name: Upload daily backup to Backblaze B2
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          BOBAKS_B2_ENDPOINT: ${{ secrets.BOBAKS_B2_ENDPOINT }}
          BOBAKS_B2_BUCKET: ${{ secrets.BOBAKS_B2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BOBAKS_B2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BOBAKS_B2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          YEAR="$(cat backup-year.txt)"
          MONTH="$(cat backup-month.txt)"
          DATE_UTC="$(cat backup-date.txt)"
          ENCRYPTED="$(cat backup-encrypted.txt)"

          DAILY_KEY="daily/${YEAR}/${MONTH}/${DATE_UTC}/${ENCRYPTED}"
          MANIFEST_KEY="daily/${YEAR}/${MONTH}/${DATE_UTC}/manifest.json"

          aws s3 cp "${ENCRYPTED}" "s3://${BOBAKS_B2_BUCKET}/${DAILY_KEY}" \
            --endpoint-url "${BOBAKS_B2_ENDPOINT}" \
            --content-type "application/octet-stream" \
            --no-progress

          aws s3 cp manifest.json "s3://${BOBAKS_B2_BUCKET}/${MANIFEST_KEY}" \
            --endpoint-url "${BOBAKS_B2_ENDPOINT}" \
            --content-type "application/json" \
            --no-progress

          if [[ "$(date -u '+%u')" == "7" ]]; then
            WEEKLY_KEY="weekly/${YEAR}/${MONTH}/${DATE_UTC}/${ENCRYPTED}"
            WEEKLY_MANIFEST_KEY="weekly/${YEAR}/${MONTH}/${DATE_UTC}/manifest.json"

            aws s3 cp "${ENCRYPTED}" "s3://${BOBAKS_B2_BUCKET}/${WEEKLY_KEY}" \
              --endpoint-url "${BOBAKS_B2_ENDPOINT}" \
              --content-type "application/octet-stream" \
              --no-progress

            aws s3 cp manifest.json "s3://${BOBAKS_B2_BUCKET}/${WEEKLY_MANIFEST_KEY}" \
              --endpoint-url "${BOBAKS_B2_ENDPOINT}" \
              --content-type "application/json" \
              --no-progress

            printf '%s\n' "${WEEKLY_KEY}" > backup-weekly-key.txt
          else
            : > backup-weekly-key.txt
          fi

      - name: Verify remote backup integrity
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          BOBAKS_B2_ENDPOINT: ${{ secrets.BOBAKS_B2_ENDPOINT }}
          BOBAKS_B2_BUCKET: ${{ secrets.BOBAKS_B2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BOBAKS_B2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BOBAKS_B2_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          YEAR="$(cat backup-year.txt)"
          MONTH="$(cat backup-month.txt)"
          DATE_UTC="$(cat backup-date.txt)"
          ENCRYPTED="$(cat backup-encrypted.txt)"
          EXPECTED_SHA="$(cat backup-sha256.txt)"

          DAILY_KEY="daily/${YEAR}/${MONTH}/${DATE_UTC}/${ENCRYPTED}"
          aws s3api head-object \
            --bucket "${BOBAKS_B2_BUCKET}" \
            --key "${DAILY_KEY}" \
            --endpoint-url "${BOBAKS_B2_ENDPOINT}" >/dev/null

          aws s3 cp "s3://${BOBAKS_B2_BUCKET}/${DAILY_KEY}" remote-backup.enc \
            --endpoint-url "${BOBAKS_B2_ENDPOINT}" \
            --no-progress

          ACTUAL_SHA="$(sha256sum remote-backup.enc | awk '{print $1}')"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 310000 \
            -in remote-backup.enc \
            -out restored-check.dump \
            -pass env:BACKUP_ENCRYPTION_KEY

          pg_restore --list restored-check.dump >/dev/null

          echo "Remote backup uploaded, checksum-verified, decrypted, and structurally readable."

      - name: Publish backup summary
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Backup date: $(cat backup-date.txt)"
          echo "Encrypted backup SHA-256: $(cat backup-sha256.txt)"
          if [[ -s backup-weekly-key.txt ]]; then
            echo "Weekly archive: $(cat backup-weekly-key.txt)"
          else
            echo "Weekly archive: not scheduled today"
          fi
