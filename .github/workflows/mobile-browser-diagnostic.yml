name: Mobile Browser Production Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-browser-diagnostic.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Open production site in mobile Chrome
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 393, height: 873 },
            deviceScaleFactor: 2,
            isMobile: true,
            hasTouch: true,
            userAgent: 'Mozilla/5.0 (Linux; Android 15; Mobile) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36'
          });

          page.on('console', msg => console.log('[console]', msg.type(), msg.text()));
          page.on('pageerror', error => console.log('[pageerror]', error.message));
          page.on('requestfailed', request => console.log('[requestfailed]', request.url(), request.failure()?.errorText ?? 'unknown'));

          await page.goto('https://bobaks-ranking-api.ryan-oledan0.workers.dev/', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(5000);

          console.log('[url]', page.url());
          console.log('[title]', await page.title());
          console.log('[error]', await page.locator('.banner.error').allTextContents());
          console.log('[rows]', await page.locator('.rows .row').count());
          console.log('[liveCoverage]', await page.locator('.data-list li').first().textContent());

          const result = await page.evaluate(() => ({
            api: window.__BOBAKS_API__,
            snapshot: window.__BOBAKS_RANKING_SNAPSHOT__ ?? null,
            htmlRows: document.querySelectorAll('.rows .row').length,
            bodyText: document.body.innerText.slice(0, 1200)
          }));
          console.log('[state]', JSON.stringify(result));

          if (!result.snapshot?.data?.length) {
            throw new Error('Mobile browser did not receive live ranking data');
          }

          await browser.close();
          NODE
