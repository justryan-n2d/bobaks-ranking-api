name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify production API data
        run: |
          set -e
          for i in $(seq 1 24); do
            health=$(curl -fsS https://bobaks-api-production.up.railway.app/api/health || true)
            games=$(curl -fsS https://bobaks-api-production.up.railway.app/api/games || true)
            live=$(curl -fsS https://bobaks-api-production.up.railway.app/api/rankings/live || true)
            weekly=$(curl -fsS https://bobaks-api-production.up.railway.app/api/rankings/weekly || true)
            monthly=$(curl -fsS https://bobaks-api-production.up.railway.app/api/rankings/monthly || true)
            yearly=$(curl -fsS https://bobaks-api-production.up.railway.app/api/rankings/yearly || true)

            if echo "$health" | jq -e '.ok == true and .database == "connected"' >/dev/null 2>&1 &&                echo "$games" | jq -e '.data | length > 0' >/dev/null 2>&1 &&                echo "$live" | jq -e '.data | length > 0' >/dev/null 2>&1 &&                echo "$weekly" | jq -e '.data | length > 0' >/dev/null 2>&1 &&                echo "$monthly" | jq -e '.data | length > 0' >/dev/null 2>&1 &&                echo "$yearly" | jq -e '.data | length > 0' >/dev/null 2>&1; then
              echo "Production API is returning real database-backed game and ranking data."
              echo "Games: $games"
              echo "Live rankings: $live"
              echo "Weekly rankings: $weekly"
              echo "Monthly rankings: $monthly"
              echo "Yearly rankings: $yearly"
              exit 0
            fi

            echo "Production API data not ready yet (attempt $i/24). Retrying in 10s..."
            sleep 10
          done

          echo "Production API did not return usable game/ranking data within 4 minutes."
          echo "Health: $health"
          echo "Games: $games"
          echo "Live: $live"
          echo "Weekly: $weekly"
          echo "Monthly: $monthly"
          echo "Yearly: $yearly"
          exit 1

      - name: Verification marker
        run: echo "Production smoke test completed for this commit."
