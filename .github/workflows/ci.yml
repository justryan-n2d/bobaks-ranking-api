name: CI

on:
  push:
    branches: [main, phase2-cloudflare-worker]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run backend tests
        run: npm test
      - name: Run frontend verification
        run: npm run test:frontend
      - name: Run worker wiring tests
        run: npm run test:worker
      - name: Build backend
        run: npm run build
      - name: Generate Worker types
        run: npm run worker:types
      - name: Check Cloudflare Worker bundle
        run: npm run worker:check
      - name: Verification marker
        run: echo "Backend tests, frontend verification, worker wiring, backend build, and Cloudflare Worker bundle check completed for this commit."
