name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run frontend verification
        run: npm run test:frontend
      - name: Run backend tests
        run: npm test
      - name: Run social content tests
        run: node --test test/social-content-generator.test.mjs
      - name: Build backend
        run: npm run build
      - name: Verification marker
        run: echo "Backend tests, frontend verification, and build completed for this commit."
