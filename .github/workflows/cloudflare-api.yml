name: Deploy Cloudflare API

on:
  push:
    branches: [main]
    paths:
      - "src/api-worker.ts"
      - "src/roblox-identity.ts"
      - "test/api-worker.test.ts"
      - "test/roblox-identity-api.test.ts"
      - "wrangler.api.jsonc"
      - "docs/ranking-methodology.md"
      - "docs/phase-6-7-roblox-identity.md"
      - ".github/workflows/cloudflare-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.api.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test live API
        shell: bash
        run: |
          set -euo pipefail

          API="https://bobaks-ranking-api-service.ryan-oledan0.workers.dev"

          health=$(curl -fsS "$API/api/health")
          echo "$health" | jq -e '.ok == true and .database == "connected"' >/dev/null

          games=$(curl -fsS "$API/api/games")
          echo "$games" | jq -e '.data | length > 0' >/dev/null

          live=$(curl -fsS "$API/api/rankings?period=live")
          echo "$live" | jq -e '.period == "live" and (.data | length > 0)' >/dev/null

          methodology=$(curl -fsS "$API/api/rankings/methodology")
          echo "$methodology" | jq -e '.methodologyVersion == "2026-09-28" and (.eligibility.live | contains("15 minutes")) and .eligibility.weekly.minimumSamples == 12 and .eligibility.weekly.minimumCoverage == 0.5' >/dev/null

          audit=$(curl -fsS "$API/api/rankings/audit")
          echo "$audit" | jq -e '.auditStatus == "passed" and .rankings.live.rows == 100 and .rankings.weekly.rows == 100 and .rankings.monthly.rows == 100 and .rankings.yearly.rows == 100' >/dev/null

          game_id=$(echo "$games" | jq -r '.data[0].id')
          curl -fsS "$API/api/games/$game_id/peak"             | jq -e '.data.gameId != null' >/dev/null

          echo "Cloudflare API Worker is serving real Supabase-backed data."
