name: Deploy Cloudflare API

on:
  push:
    branches: [main]
    paths:
      - "src/api-worker.ts"
      - "test/api-worker.test.ts"
      - "wrangler.api.jsonc"
      - ".github/workflows/cloudflare-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.api.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
