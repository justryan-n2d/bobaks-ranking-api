name: Production Failure Alerting

on:
  workflow_run:
    workflows:
      - Production Health Monitor
    types:
      - completed

permissions:
  contents: read
  issues: write

concurrency:
  group: bobaks-production-alerting
  cancel-in-progress: true

jobs:
  incident:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or close production incident
        uses: actions/github-script@v8
        env:
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Bobaks production incident';
            const conclusion = process.env.RUN_CONCLUSION;
            const runNumber = process.env.RUN_NUMBER;
            const runUrl = process.env.RUN_URL;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = openIssues.find((issue) => issue.title === title);

            if (conclusion === 'failure') {
              if (existing) {
                core.info(`Active production incident #${existing.number} already exists.`);
                return;
              }

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  'Production Health Monitor detected a failure.',
                  '',
                  `Run #${runNumber}`,
                  `Run URL: ${runUrl}`,
                  '',
                  'The issue stays open until a later Production Health Monitor run succeeds.'
                ].join('\\n')
              });

              core.info(`Created production incident #${issue.data.number}.`);
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Production Health Monitor recovered at ${new Date().toISOString()}. Closing this incident.`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });

              core.info(`Closed recovered production incident #${existing.number}.`);
              return;
            }

            core.info('No active production incident to close.');

      - name: Alerting summary
        run: echo "Production failure alerting completed."
