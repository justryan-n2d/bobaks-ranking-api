<body>
<header class="topbar"><div class="brand"><span class="brand-mark">B</span><span>BOBAKS RANKING</span></div><div class="live-status"><span></span> LIVE DATA</div></header>
<main id="app" class="content"></main>
<script>
const API='https://bobaks-ranking-api-service.ryan-oledan0.workers.dev';
const periods=[['live','Live'],['week','This Week'],['month','This Month'],['year','This Year']];
let state={period:'live',games:[],updatedAt:null,nextRefreshAt:null,refreshIntervalSeconds:null,loading:true,error:'',query:'',search:[],selected:null,info:null,methodology:null,audit:null,infoLoading:false,searchTimer:null};
let refreshTimer=null;
const fmt=n=>new Intl.NumberFormat('en-US').format(Number(n)||0);
const rel=s=>{if(!s)return'No snapshot yet';const m=Math.max(0,Date.now()-new Date(s).getTime())/60000;if(m<1)return'just now';if(m<60)return Math.floor(m)+'m ago';if(m<1440)return Math.floor(m/60)+'h ago';return Math.floor(m/1440)+'d ago'};
const countdown=s=>{if(!s)return'--:--';const x=Math.max(0,Math.ceil((new Date(s).getTime()-Date.now())/1000));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(url,name){const letter=esc((name||'?')[0]);const fallback='<span class="icon-fallback">'+letter+'</span>';return url?'<span class="icon-wrap"><img src="'+esc(url)+'" alt="" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden class="icon-fallback">'+letter+'</span></span>':'<span class="icon-wrap">'+fallback+'</span>'}
function fallbackNextCollectionAt(){const interval=600000;const now=Date.now();return new Date((Math.floor(now/interval)+1)*interval+15000).toISOString()}
async function api(path){const r=await fetch(API+path);if(!r.ok)throw new Error('API '+r.status);return r.json()}
function scheduleRefresh(seconds){if(refreshTimer)clearTimeout(refreshTimer);const delay=Math.round(Number(seconds)*1000);if(!Number.isFinite(delay)||delay<1000)return;refreshTimer=setTimeout(()=>load(),delay)}
async function load(period=state.period){state.loading=true;state.error='';render();try{const p=await api('/api/rankings?period='+period);state.games=(p.data||[]).map(x=>({rank:x.rank,gameId:x.gameId,universeId:Number(x.game?.universeId||0),placeId:Number(x.game?.placeId||0),name:x.game?.name||'Unknown game',creator:x.game?.creatorName||'Unknown creator',playing:Number(x.score||0),icon:x.game?.iconUrl,updatedAt:x.calculatedAt}));state.updatedAt=p.updatedAt||null;state.refreshIntervalSeconds=Number(p.refreshIntervalSeconds)||600;state.nextRefreshAt=p.nextCollectionAt||p.nextRefreshAt||fallbackNextCollectionAt();scheduleRefresh(Math.max(1,(new Date(state.nextRefreshAt).getTime()-Date.now())/1000))}catch(e){state.games=[];state.nextRefreshAt=null;state.error='Ranking data could not be loaded right now. Try again in a moment.'}finally{state.loading=false;render()}}
async function search(q){if(q.trim().length<2){state.search=[];render();return}try{const p=await api('/api/search?q='+encodeURIComponent(q.trim()));state.search=(p.data||[]).map(x=>({gameId:x.id,universeId:Number(x.universeId),placeId:Number(x.placeId||0),name:x.name,creator:x.creatorName||'Unknown creator',icon:x.iconUrl,playing:0}));render()}catch{state.search=[];render()}}
async function openGame(g){state.error='';try{const p=await api('/api/games/'+encodeURIComponent(g.gameId));const game=p.data;if(!game)throw new Error('not found');const [h,peakResponse]=await Promise.all([api('/api/games/'+encodeURIComponent(g.gameId)+'/history?days=365'),api('/api/games/'+encodeURIComponent(g.gameId)+'/peak')]);const points=(h.data||[]).map(x=>({at:x.timestamp,playing:Number(x.playerCount)}));const peak=Number(peakResponse.data?.peakPlayers??0);const peakAt=peakResponse.data?.peakAt||null;state.selected={...g,...game,playing:Number(g.playing||0),creator:game.creatorName||g.creator||'Unknown creator',icon:game.iconUrl||g.icon,history:points,peak,peakAt};render()}catch{state.error='That game could not be loaded.';render()}}
function chart(points){if(points.length<2)return'<div class="chart-empty">Collecting history</div>';const w=900,h=250,v=points.map(x=>x.playing),min=Math.min(...v),max=Math.max(...v),range=Math.max(1,max-min),line=points.map((p,i)=>((i/(points.length-1))*w).toFixed(1)+','+(h-15-((p.playing-min)/range)*(h-30)).toFixed(1)).join(' ');return'<div class="chart"><svg viewBox="0 0 '+w+' '+h+'"><line x1="0" y1="235" x2="900" y2="235" class="grid-line"/><line x1="0" y1="125" x2="900" y2="125" class="grid-line"/><line x1="0" y1="15" x2="900" y2="15" class="grid-line"/><polyline points="'+line+'" class="chart-line"/></svg><div class="chart-labels"><span>'+fmt(min)+'</span><span>'+fmt(Math.round((min+max)/2))+'</span><span>'+fmt(max)+'</span></div></div>'}
function infoPage(title,intro,sections){return'<div class="info"><button class="back" onclick="state.info=null;render()">← Back to rankings</button><div class="eyebrow">BOBAKS RANKING · INFORMATION</div><h1>'+title+'</h1><p class="info-intro">'+esc(intro)+'</p><div class="disclaimer">Not affiliated with, endorsed by, or sponsored by Roblox Corporation.</div>'+sections.map(s=>'<section class="info-section"><h2>'+esc(s[0])+'</h2>'+s[1]+'</section>').join('')+'</div>'}
function textSection(v){return'<p>'+esc(v)+'</p>'}
function listSection(xs){return'<ul>'+xs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}
function ruleBox(k,v){return'<div class="rule-box"><strong>'+esc(k)+'</strong><span>'+esc(v)+'</span></div>'}
function auditBox(label,value){return'<div class="rule-box"><strong>'+esc(label)+'</strong><span>'+esc(value)+'</span></div>'}
function openInfo(key){state.info=key;state.error='';render();if((key==='methodology'||key==='audit')&&!state.infoLoading){state.infoLoading=true;Promise.all([api('/api/rankings/methodology'),api('/api/rankings/audit')]).then(([m,a])=>{state.methodology=m;state.audit=a}).catch(()=>{}).finally(()=>{state.infoLoading=false;render()})}}
function render(){const a=document.getElementById('app');if(state.info){if(state.info==='methodology'||state.info==='audit'){if(state.infoLoading&&!state.methodology){a.innerHTML='<div class="info"><button class="back" onclick="state.info=null;render()">← Back to rankings</button><div class="eyebrow">BOBAKS RANKING · INFORMATION</div><h1>How Bobaks Rankings Work</h1><p class="info-intro">Loading the current published methodology and audit status...</p></div>';return}if(!state.methodology||!state.audit){a.innerHTML=infoPage('How Bobaks Rankings Work','The published methodology and audit data could not be loaded right now.',[['Transparency',textSection('The current methodology and audit summary are published by the Bobaks Ranking API. Try again later.')]]);return}const m=state.methodology,r=m.rules||{},common=r.common||{},live=r.live||{},w=r.weekly||{},mo=r.monthly||{},y=r.yearly||{},q=m.qualifyingData||{},act=m.activity||{},integ=m.integrity||{},audit=state.audit,ar=audit.rankings||{},sections=[['Ranking periods',ruleBox('Live',live.score||'')+ruleBox('Weekly',w.period+' Score: '+w.score)+ruleBox('Monthly',mo.period+' Score: '+mo.score)+ruleBox('Yearly',y.period+' Score: '+y.score)],['Eligibility',ruleBox('Common', 'Top '+(common.topN??100)+' active games. '+(common.tieBreak||''))+ruleBox('Live',live.eligibility||'')+ruleBox('Weekly','At least '+(w.minimumSamples??12)+' samples and '+Math.round(Number(w.minimumCoverage??.5)*100)+'% coverage.')+ruleBox('Monthly','At least '+(mo.minimumSamples??12)+' samples and '+Math.round(Number(mo.minimumCoverage??.5)*100)+'% coverage.')+ruleBox('Yearly','No separate sample-count or coverage threshold.')],['Coverage and data qualification',textSection(w.coverageFormula||'')+textSection(q.collectionRuns||'')+textSection(q.snapshots||'')+textSection(q.futureSnapshotsExcluded?'Future snapshots are excluded.':'')],['Collection boundaries',ruleBox('Cadence',String(m.collection?.cadenceMinutes??10)+' minutes')+ruleBox('Timezone','UTC')+ruleBox('Boundary rule','Weekly and Monthly linked snapshots follow collection-run start time.')],['Game activity',ruleBox('Discovery',act.discovery||'')+ruleBox('Verification','24-hour stale verification grace period.')+ruleBox('Deactivation','12 consecutive verification misses, about 2 hours.')+ruleBox('Reactivation',act.reactivation||'')],['Integrity and auditability',ruleBox('Status',audit.auditStatus||'unknown')+ruleBox('Audited at',audit.auditedAt||'unknown')+ruleBox('Live snapshot age',((Number(ar.live?.maxLatestSnapshotAgeSeconds??0)).toFixed(1))+' seconds at audit time')+ruleBox('Weekly minimums',String(ar.weekly?.minimumSamplesObserved??'n/a')+' samples · '+(Number(ar.weekly?.minimumCoverageObserved??0)*100).toFixed(1)+'% coverage')+ruleBox('Monthly minimums',String(ar.monthly?.minimumSamplesObserved??'n/a')+' samples · '+(Number(ar.monthly?.minimumCoverageObserved??0)*100).toFixed(1)+'% coverage')+ruleBox('Validation',integ.validation||'')],['Limitations',listSection(m.limitations||[])]];a.innerHTML=infoPage('How Bobaks Rankings Work','These are the current published rules and live audit metadata.',sections)+'<div class="audit-line">Methodology version: '+esc(m.methodologyVersion||'unknown')+' · Audit status: '+esc(audit.auditStatus||'unknown')+' · Public endpoints: /api/rankings/methodology and /api/rankings/audit</div>';return}return}const data={privacy:['Privacy Policy',[['Information we collect','Bobaks Ranking focuses on game-level analytics used for rankings, player-count snapshots, historical charts, and game identification.'],['How information is used','Collected game-level information is used to display rankings, calculate period statistics, build historical charts, and operate the website.'],['Contact','For privacy questions, contact bobaksranking@gmail.com.']]],terms:['Terms of Use',[['Independent service','Bobaks Ranking is an independent third-party analytics website and is not affiliated with Roblox Corporation.'],['Analytics and availability','Player counts and rankings can change, may be delayed, and may occasionally be unavailable. Historical coverage depends on collected snapshots.'],['Contact','Questions about these Terms can be sent to bobaksranking@gmail.com.']]],sources:['Data Sources',[['Roblox game data','The service obtains game-level player counts and metadata from public Roblox endpoints.'],['Bobaks calculations','Bobaks Ranking calculates rankings and historical statistics from stored snapshots.'],['Freshness','External APIs can change, become unavailable, rate-limit requests, or return incomplete information. Bobaks Ranking does not fabricate historical data when source information is unavailable.']]],contact:['Contact',[['General questions','For questions about rankings, historical data, or how the website works, include the relevant game or page.'],['Technical problems','Include the page, approximate time, device/browser, and a short description. Do not include secrets or private credentials.'],['Email','bobaksranking@gmail.com']] ]};a.innerHTML=infoPage(data[state.info][0],'Bobaks Ranking is an independent, fan-made analytics website.',data[state.info][1].map(s=>[s[0],textSection(s[1])]));return}if(state.selected){const g=state.selected;a.innerHTML='<div class="detail"><button class="back" onclick="state.selected=null;render()">← Back to rankings</button><section class="detail-hero">'+icon(g.icon,g.name)+'<div><div class="eyebrow">GAME DETAILS</div><h1>'+esc(g.name)+'</h1><p>by '+esc(g.creator)+'</p><a class="roblox" href="https://www.roblox.com/games/'+encodeURIComponent(g.placeId||0)+'" target="_blank" rel="noreferrer">Open on Roblox ↗</a></div></section><section class="stats"><div class="stat"><span>Current Players</span><strong>'+fmt(g.playing)+'</strong><small>'+rel(g.updatedAt)+'</small></div><div class="stat"><span>Recorded Peak</span><strong>'+fmt(g.peak)+'</strong><small>from collected snapshots</small></div><div class="stat"><span>Data Since</span><strong>'+fmt(g.history.length)+'</strong><small>stored samples</small></div></section><section class="panel"><div class="panel-head"><div><h2>Player Count</h2><p>Collected history for this game</p></div></div>'+chart(g.history)+'</section></div>';return}
const tabs=periods.map(p=>'<button class="'+(state.period===p[0]?'active':'')+'" onclick="state.period=\''+p[0]+'\';load()">'+(p[0]==='live'?'<span class="tab-live"></span>':'')+p[1]+'</button>').join('');
const list=state.loading&&!state.games.length?Array.from({length:8},(_,i)=>'<div class="game skeleton"><span></span><span></span><span></span><span></span></div>').join(''):state.games.map(g=>'<button class="game" onclick="openGame('+JSON.stringify(g).replace(/"/g,'&quot;')+')"><span class="rank">#'+g.rank+'</span>'+icon(g.icon,g.name)+'<span class="game-info"><strong>'+esc(g.name)+'</strong><small>'+esc(g.creator)+'</small></span><span class="players">♟ '+fmt(g.playing) + ' <small>'+(state.period==='live'?'players':'avg players')+'</small></span><span class="trend same">0</span><span class="open">↗</span></button>').join('');
a.innerHTML='<section class="hero"><div class="eyebrow"><span class="red-dot"></span> PLAYER COUNT TRACKER</div><h1>BOBAKS<br><em>RANKING</em></h1><p>Live rankings and historical trends for Roblox experiences.</p></section><div class="controls"><nav class="tabs">'+tabs+'</nav><button class="refresh" onclick="load()" '+(state.loading?'disabled':'')+'>↻ Refresh</button></div><div class="search"><span>⌕</span><input id="q" value="'+esc(state.query)+'" placeholder="Search a Roblox game..."><span class="searching">'+(state.query.length>=2?'Searching...':'')+'</span><div class="dropdown">'+state.search.slice(0,8).map(g=>'<button onclick="openGame('+JSON.stringify(g).replace(/"/g,'&quot;')+');state.search=[]"><span class="icon">'+esc((g.name||'?')[0])+'</span><span><strong>'+esc(g.name)+'</strong><small>'+esc(g.creator)+'</small></span></button>').join('')+'</div></div><section class="list-head"><div><h2>'+(state.period==='live'?'Top Games Right Now':periods.find(x=>x[0]===state.period)[1]+' Rankings')+'</h2><p>'+(state.period==='live'?'Games with the most players right now':'Based on the average player count from snapshots collected '+state.period+'.')+'</p></div><div class="updated">Calculated '+(state.updatedAt?new Date(state.updatedAt).toISOString():'not available')+' · Refreshes in '+countdown(state.nextRefreshAt)+'</div></section>'+(state.error?'<div class="banner error">'+esc(state.error)+'<button onclick="load()">Retry</button></div>':'')+(state.period!=='live'&&!state.loading&&!state.games.length?'<div class="banner"><strong>History is still building.</strong> No historical player counts are being invented.</div>':'')+'<section class="ranking-list">'+(list||'<div class="empty">No ranking data is available yet.</div>')+'</section><footer><div class="footer-brand"><strong>Bobaks Ranking</strong><span>Live rankings and historical trends for Roblox experiences.</span></div><div class="footer-meta"><span>Data from permitted Roblox public endpoints</span><nav class="footer-links"><button onclick="openInfo('privacy')">Privacy</button><button onclick="openInfo('terms')">Terms</button><button onclick="openInfo('methodology')">How Rankings Work</button><button onclick="openInfo('sources')">Data Sources</button><button onclick="openInfo('contact')">Contact</button></nav></div></footer>';
const q=document.getElementById('q');if(q){q.oninput=e=>{state.query=e.target.value;clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>search(state.query),250)}}}
load();
setInterval(()=>{if(!state.selected)render()},1000);
</script>
</body>
</html>
