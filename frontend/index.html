.detail{padding-top:16px}.back{border:0;background:transparent;color:#8b96a4;display:flex;align-items:center;gap:4px;font-size:11px;padding:0;margin-bottom:18px}.detail-head{display:flex;align-items:flex-start;gap:18px;padding-bottom:20px}.detail-cover{width:116px;height:116px;border-radius:19px;object-fit:cover;background:#151a21;flex:none}.detail-heading{min-width:0;flex:1}.detail-heading h1{font-size:clamp(28px,5vw,48px);line-height:1;letter-spacing:-.04em;margin:5px 0 5px}.detail-heading p{color:#7d8794;margin:0 0 12px;font-size:12px}.head-actions{display:flex;gap:7px;flex-wrap:wrap}.link-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #242b35;background:#11161d;color:#c7cfd8;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:850}.link-btn.primary{color:#ff8989;border-color:#503033}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat,.panel{background:#0d1117;border:1px solid #1b2028;border-radius:13px}.stat{padding:15px;display:grid;gap:6px}.stat span,.stat small{color:#707b88;font-size:10px}.stat strong{font-size:22px;line-height:1.1}.stat-note{color:#8d97a5;font-size:9px}.panel{padding:18px;margin-bottom:12px}.panel-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:14px}.panel h2{margin:0;font-size:17px}.panel p{margin:4px 0 0;color:#737e8c;font-size:10px}.insight-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.insight{background:#10151c;border:1px solid #202731;border-radius:10px;padding:12px;display:grid;gap:5px}.insight span{font-size:9px;color:#6d7784}.insight strong{font-size:15px}.chart-wrap{overflow:hidden}.chart{height:280px}.chart svg{width:100%;height:245px;display:block}.grid-line{stroke:#202630}.chart-line{stroke:#ff4b4b;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}.rank-line{stroke:#93a2ff;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}.chart-labels{display:flex;justify-content:space-between;color:#596472;font-size:9px}.chart-empty{height:220px;display:grid;place-items:center;border:1px dashed #242c36;border-radius:10px;color:#626c79}.meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.meta{padding:12px;border:1px solid #202731;border-radius:10px}.meta span{display:block;color:#687381;font-size:9px;margin-bottom:4px}.meta strong{display:block;color:#cfd6df;font-size:11px;word-break:break-word}.compare-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.compare-card{background:#0d1117;border:1px solid #1b2028;border-radius:13px;padding:15px}.compare-card h3{margin:0 0 4px;font-size:14px}.compare-card small{color:#7d8794;font-size:9px}.compare-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.compare-stat{padding:10px;background:#10151c;border:1px solid #202731;border-radius:9px}.compare-stat span{display:block;color:#687381;font-size:8px}.compare-stat strong{display:block;margin-top:4px;font-size:13px}.info{max-width:900px}.info h1{font-size:clamp(38px,6vw,62px);letter-spacing:-.05em;margin:12px 0}.info-intro{color:#8d97a5;line-height:1.7;font-size:13px}.info-section{padding:20px 0;border-top:1px solid #1b2028}.info-section h2{margin:0 0 8px;font-size:16px}.info-section p{margin:0;color:#858f9d;line-height:1.75;font-size:12px}.info-section ul{margin:10px 0 0;padding-left:18px;color:#858f9d;line-height:1.8;font-size:12px}.info-section li{margin:4px 0}.rule-box{display:grid;gap:7px;padding:12px 14px;margin:8px 0 0;background:#0d1117;border:1px solid #1b2028;border-radius:9px;color:#aeb7c3;font-size:11px;line-height:1.6}.rule-box strong{color:#eef2f7}.disclaimer{padding:12px 14px;margin:18px 0;border:1px solid #303741;border-radius:9px;background:#0d1117;color:#a6b0bc;line-height:1.6;font-size:11px}.skeleton{animation:pulse 1.4s ease-in-out infinite}.skeleton > *{background:#151a21;border-radius:8px;height:18px}@keyframes pulse{50%{opacity:.45}}
footer{display:flex;justify-content:space-between;gap:24px;color:#505a67;font-size:9px;padding:24px 2px 8px;border-top:1px solid #171c23;margin-top:16px}.footer-brand,.footer-meta{display:grid;gap:6px}.footer-brand{max-width:520px}.footer-brand strong{color:#cfd6df;font-size:11px}.footer-brand span{color:#697482}.footer-meta{text-align:right}.footer-links{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 12px}.footer-links button{border:0;background:transparent;color:#788391;padding:0;font-size:9px}
@media(max-width:880px){.mover-grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.game-row{grid-template-columns:34px 1fr 88px 80px;gap:7px}.game-main{grid-column:2;grid-row:1}.players{grid-column:3;grid-row:1}.movement{grid-column:4;grid-row:1}.row-actions{grid-column:2/5;justify-content:flex-start;padding-left:68px}.game-row{align-items:center}.insight-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.topbar{height:62px}.brand{font-size:11px}.top-actions .top-action{padding:7px 8px}.live-status{display:none}.content{width:calc(100% - 20px);padding-top:28px}.hero{padding-top:5px}.controls{flex-direction:column;align-items:stretch}.tabs button{flex:1}.refresh{justify-content:center}.search-note{display:none}.mover-grid{grid-template-columns:1fr 1fr}.list-head{align-items:flex-start;flex-direction:column}.updated{text-align:left;white-space:normal}.game-row{grid-template-columns:26px 1fr max-content}.game-main{grid-column:2}.players{grid-column:3}.movement{grid-column:3;grid-row:2;text-align:right}.row-actions{grid-column:2/4;padding-left:0}.detail-head{gap:12px}.detail-cover{width:84px;height:84px;border-radius:14px}.detail-heading h1{font-size:28px}.stats{grid-template-columns:1fr 1fr}.insight-grid{grid-template-columns:1fr 1fr}.meta-grid,.compare-grid{grid-template-columns:1fr}.footer-brand{max-width:none}.footer-meta{text-align:left}.footer-links{justify-content:flex-start}}

<body>
<header class="topbar">
  <button class="brand top-action" onclick="navigate('home')" aria-label="Go to Bobaks rankings"><span class="brand-mark">B</span><span>BOBAKS RANKING</span></button>
  <nav class="top-actions" aria-label="Primary">
    <button id="nav-home" class="top-action active" onclick="navigate('home')">Rankings</button>
    <button id="nav-watchlist" class="top-action" onclick="navigate('watchlist')">Saved <span id="saved-count"></span></button>
    <button id="nav-compare" class="top-action" onclick="navigate('compare')" hidden>Compare</button>
  </nav>
  <div class="live-status"><span></span> LIVE DATA</div>
</header>
<main id="app" class="content"></main>
<script>
const API='https://bobaks-ranking-api-service.ryan-oledan0.workers.dev';
const periods=[['live','Live'],['week','This Week'],['month','This Month'],['year','This Year']];
const state={
  view:'home',period:'live',games:[],selected:null,search:[],query:'',error:'',loading:true,
  updatedAt:null,nextRefreshAt:null,refreshTimer:null,searchTimer:null,watchlist:[],compare:[]
};
const fmt=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(Number(n)||0);
const fmt1=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:1}).format(Number(n)||0);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateFmt=s=>{if(!s)return'Not available';const d=new Date(s);return Number.isFinite(d.getTime())?d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Not available'};
const rel=s=>{if(!s)return'No data';const m=Math.max(0,(Date.now()-new Date(s).getTime())/60000);if(m<1)return'just now';if(m<60)return Math.floor(m)+'m ago';if(m<1440)return Math.floor(m/60)+'h ago';return Math.floor(m/1440)+'d ago'};
const countdown=s=>{if(!s)return'--:--';const x=Math.max(0,Math.ceil((new Date(s).getTime()-Date.now())/1000));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
function saved(){return new Set(state.watchlist.map(String))}
function saveState(){try{localStorage.setItem('bobaks.watchlist',JSON.stringify(state.watchlist.map(String)))}catch{}updateNav()}
function loadState(){try{const x=JSON.parse(localStorage.getItem('bobaks.watchlist')||'[]');if(Array.isArray(x))state.watchlist=[...new Set(x.map(String).filter(Boolean))]}catch{state.watchlist=[]}updateNav()}
function updateNav(){const n=document.getElementById('saved-count');if(n)n.textContent=state.watchlist.length?'('+state.watchlist.length+')':'';const c=document.getElementById('nav-compare');if(c){c.hidden=state.compare.length===0;c.textContent='Compare ('+state.compare.length+')'}['home','watchlist'].forEach(v=>{const b=document.getElementById('nav-'+v);if(b)b.classList.toggle('active',state.view===v)})}
async function api(path){const r=await fetch(API+path);if(!r.ok)throw new Error('API '+r.status);return r.json()}
function scheduleRefresh(){if(state.refreshTimer)clearTimeout(state.refreshTimer);if(!state.nextRefreshAt)return;const delay=Math.max(1000,new Date(state.nextRefreshAt).getTime()-Date.now());state.refreshTimer=setTimeout(()=>loadRankings(),delay)}
function fallbackNext(){const step=600000,now=Date.now();return new Date((Math.floor(now/step)+1)*step+15000).toISOString()}
async function loadRankings(){state.loading=true;state.error='';render();try{const p=await api('/api/rankings?period='+encodeURIComponent(state.period));state.games=(p.data||[]).map(x=>({rank:Number(x.rank),gameId:String(x.gameId),name:x.game?.name||'Unknown game',creator:x.game?.creatorName||'Unknown creator',icon:x.game?.iconUrl||'',playing:Number(x.score||0),previousRank:x.previousRank==null?null:Number(x.previousRank),rankChange:x.rankChange==null?null:Number(x.rankChange),calculatedAt:x.calculatedAt||null,universeId:Number(x.game?.universeId||0),placeId:Number(x.game?.placeId||0)}));state.updatedAt=p.updatedAt||null;state.nextRefreshAt=p.nextCollectionAt||fallbackNext();scheduleRefresh()}catch{state.games=[];state.nextRefreshAt=null;state.error='Ranking data could not be loaded right now. Try again in a moment.'}finally{state.loading=false;render()}}
function rankMovement(g){if(g.previousRank==null)return '<span class="movement new">NEW</span>';const d=Number(g.rankChange||0);if(d>0)return '<span class="movement up">▲ '+d+'</span>';if(d<0)return '<span class="movement down">▼ '+Math.abs(d)+'</span>';return '<span class="movement same">•</span>'}
function gameIcon(g,large=false){if(g?.icon)return '<img class="'+(large?'detail-cover':'game-img')+'" src="'+esc(g.icon)+'" alt="" referrerpolicy="no-referrer" onerror="this.hidden=true">';return '<div class="'+(large?'detail-cover':'game-img')+'"></div>'}
function moverCards(){if(!state.games.length)return '';const eligible=state.games.filter(g=>g.previousRank!=null);const rising=[...eligible].sort((a,b)=>(b.rankChange||0)-(a.rankChange||0)).find(g=>(g.rankChange||0)>0);const falling=[...eligible].sort((a,b)=>(a.rankChange||0)-(b.rankChange||0)).find(g=>(g.rankChange||0)<0);const newest=state.games.find(g=>g.previousRank==null);const peakish=[...state.games].sort((a,b)=>b.playing-a.playing)[0];const card=(title,g,kind)=>'<div class="mover"><h3>'+title+'</h3><p>'+kind+'</p><strong>'+(g?esc(g.name):'None yet')+'</strong><div class="sub">'+(g?(kind==='Peak records'?fmt(g.playing)+' players':'#'+g.rank+' · '+(g.rankChange==null?'NEW':(g.rankChange>0?'up '+g.rankChange:'down '+Math.abs(g.rankChange)))):'')+'</div></div>';return '<section class="mover-grid">'+card('Rising',''+(rising||''),'Biggest visible climb')+card('Falling',falling,'Biggest visible drop')+card('New entries',newest,'Not present in the prior ranking')+card('Most players',peakish,'Top current player count')+'</section>'}
function renderRankingRows(){if(state.loading&&!state.games.length)return Array.from({length:7},()=>'<div class="game-row skeleton"><span></span><span></span><span></span><span></span></div>').join('');if(!state.games.length)return '<div class="empty">No ranking data is available yet.</div>';const set=saved();return state.games.map(g=>'<article class="game-row"><span class="rank">#'+g.rank+'</span><button class="game-main" onclick="openGameId(\\''+g.gameId+'\\')" aria-label="Open '+esc(g.name)+' details">'+gameIcon(g)+'<span class="game-info"><strong>'+esc(g.name)+'</strong><small>'+esc(g.creator)+'</small></span></button><span class="players"><strong>'+fmt(g.playing)+'</strong><small>'+(state.period==='live'?'players':'avg players')+'</small></span>'+rankMovement(g)+'<span class="row-actions"><button class="mini '+(set.has(g.gameId)?'saved':'')+'" onclick="toggleSave(\\''+g.gameId+'\\');event.stopPropagation()">'+(set.has(g.gameId)?'Saved':'Save')+'</button><button class="mini" onclick="toggleCompare(\\''+g.gameId+'\\');event.stopPropagation()">'+(state.compare.includes(g.gameId)?'Compared':'Compare')+'</button></span></article>').join('')}
function freshness(){if(!state.updatedAt)return '';const age=(Date.now()-new Date(state.updatedAt).getTime())/1000;return '<span class="'+(age<=900?'fresh':'stale')+'">'+(age<=900?'Fresh':'Stale')+'</span>'}
function renderHome(){const tabs=periods.map(p=>'<button class="'+(state.period===p[0]?'active':'')+'" onclick="changePeriod(\\''+p[0]+'\\')">'+(p[0]==='live'?'<span class="tab-live"></span>':'')+p[1]+'</button>').join('');const heading=state.period==='live'?'Top Games Right Now':periods.find(x=>x[0]===state.period)[1]+' Rankings';const subtitle=state.period==='live'?'Games with the most players in the latest qualifying snapshot.':'Ranked by average player count from qualifying snapshots in the current period.';return '<section class="hero"><div class="eyebrow"><span class="red-dot"></span> PLAYER COUNT TRACKER</div><h1>BOBAKS<br><em>RANKING</em></h1><p>Live rankings and historical trends for Roblox experiences.</p></section><div class="controls"><nav class="tabs">'+tabs+'</nav><button class="refresh" onclick="loadRankings()" '+(state.loading?'disabled':'')+'>↻ Refresh</button></div><div class="search"><span>⌕</span><input id="q" value="'+esc(state.query)+'" placeholder="Search a Roblox game, creator, or developer" aria-label="Search games"><span class="search-note">'+(state.query.length>=2?'Searching...':'')+'</span><div id="search-results" class="dropdown">'+state.search.slice(0,8).map(g=>'<button onclick="openGameId(\\''+g.gameId+'\\');state.search=[]"><span class="icon">'+(g.icon?'<img src="'+esc(g.icon)+'" alt="" width="42" height="42">':'')+'</span><span><strong>'+esc(g.name)+'</strong><small>'+esc(g.creator)+'</small></span></button>').join('')+'</div></div>'+moverCards()+'<section class="list-head"><div><h2>'+heading+'</h2><p>'+subtitle+'</p></div><div class="updated">Calculated '+(state.updatedAt?new Date(state.updatedAt).toLocaleTimeString(): 'not available')+' · '+freshness()+' · next '+countdown(state.nextRefreshAt)+'</div></section>'+(state.error?'<div class="banner error">'+esc(state.error)+'<button onclick="loadRankings()">Retry</button></div>':'')+(state.period!=='live'&&!state.loading&&!state.games.length?'<div class="banner"><strong>History is still building.</strong> Bobaks does not invent missing historical data.</div>':'')+'<section class="ranking-list">'+renderRankingRows()+'</section>'+footer()}
function footer(){return '<footer><div class="footer-brand"><strong>Bobaks Ranking</strong><span>Live rankings and historical trends for Roblox experiences.</span><span>Independent fan-made analytics site. Not affiliated with, endorsed by, or sponsored by Roblox Corporation.</span></div><div class="footer-meta"><span>Game-level public data · no player-level profiles</span><nav class="footer-links"><button onclick="navigate(\\'info:privacy\\')">Privacy</button><button onclick="navigate(\\'info:terms\\')">Terms</button><button onclick="navigate(\\'info:methodology\\')">How Rankings Work</button><button onclick="navigate(\\'info:sources\\')">Data Sources</button><button onclick="navigate(\\'info:contact\\')">Contact</button></nav></div></footer>'}
async function searchGames(q){if(q.trim().length<2){state.search=[];render();return}try{const p=await api('/api/search?q='+encodeURIComponent(q.trim()));state.search=(p.data||[]).map(x=>({gameId:String(x.id),name:x.name,creator:x.creatorName||'Unknown creator',icon:x.iconUrl||''}));render()}catch{state.search=[];render()}}
function historyDaily(points){const map=new Map();for(const p of points||[]){const d=new Date(p.at||p.timestamp).toISOString().slice(0,10);const v=Number(p.playing||p.playerCount||0);if(!map.has(d))map.set(d,[]);map.get(d).push(v)}return [...map.entries()].map(([date,values])=>({date,avg:values.reduce((a,b)=>a+b,0)/values.length})).sort((a,b)=>a.date.localeCompare(b.date))}
function playerChart(points){const daily=historyDaily(points);if(daily.length<2)return '<div class="chart-empty">Not enough collected history yet.</div>';const vals=daily.map(x=>x.avg),min=Math.min(...vals),max=Math.max(...vals),range=Math.max(1,max-min),w=900,h=245;const line=daily.map((p,i)=>((i/(daily.length-1))*w).toFixed(1)+','+(h-12-((p.avg-min)/range)*(h-28)).toFixed(1)).join(' ');return '<div class="chart"><svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Player count trend"><line x1="0" y1="233" x2="900" y2="233" class="grid-line"/><line x1="0" y1="122" x2="900" y2="122" class="grid-line"/><line x1="0" y1="11" x2="900" y2="11" class="grid-line"/><polyline points="'+line+'" class="chart-line"/></svg><div class="chart-labels"><span>'+dateFmt(daily[0].date)+'</span><span>'+dateFmt(daily[Math.floor(daily.length/2)].date)+'</span><span>'+dateFmt(daily[daily.length-1].date)+'</span></div></div>'}
function rankChart(points){if(!points||points.length<2)return '<div class="chart-empty">Rank history is still building.</div>';const vals=points.map(x=>Number(x.rank)).filter(Number.isFinite);if(vals.length<2)return '<div class="chart-empty">Rank history is still building.</div>';const min=Math.min(...vals),max=Math.max(...vals),range=Math.max(1,max-min),w=900,h=245;const line=points.map((p,i)=>{const y=12+((Number(p.rank)-min)/range)*(h-30);return (i/(points.length-1)*w).toFixed(1)+','+y.toFixed(1)}).join(' ');return '<div class="chart"><svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Daily rank history"><line x1="0" y1="12" x2="900" y2="12" class="grid-line"/><line x1="0" y1="122" x2="900" y2="122" class="grid-line"/><line x1="0" y1="233" x2="900" y2="233" class="grid-line"/><polyline points="'+line+'" class="rank-line"/></svg><div class="chart-labels"><span>#'+Math.min(...vals)+'</span><span>better ↑</span><span>#'+Math.max(...vals)+'</span></div></div>'}
function trendInsights(current,history){const daily=historyDaily(history);const recent=daily.slice(-7).map(x=>x.avg).filter(Number.isFinite);const avg=recent.length?recent.reduce((a,b)=>a+b,0)/recent.length:null;const pct=avg&&avg>0?((current-avg)/avg)*100:null;const all=daily.map(x=>x.avg).filter(Number.isFinite);const longer=all.slice(-30);const longAvg=longer.length?longer.reduce((a,b)=>a+b,0)/longer.length:null;const unusual=longAvg&&longAvg>0?((current-longAvg)/longAvg)*100:null;return{avg7:avg,pct,unusual}}
async function openGameId(id){state.view='detail';state.selected={gameId:String(id),loading:true};state.error='';render();try{const [g,h,p,rh]=await Promise.all([api('/api/games/'+encodeURIComponent(id)),api('/api/games/'+encodeURIComponent(id)+'/history?days=365'),api('/api/games/'+encodeURIComponent(id)+'/peak'),api('/api/games/'+encodeURIComponent(id)+'/rank-history?days=31')]);const game=g.data||{};const points=(h.data||[]).map(x=>({at:x.timestamp||x.date,playing:Number(x.playerCount||0)}));state.selected={...game,gameId:String(id),name:game.name||'Unknown game',creator:game.creatorName||'Unknown creator',icon:game.iconUrl||'',placeId:Number(game.placeId||0),description:game.description||'',history:points,historyResolution:h.resolution||'snapshot',peak:Number(p.data?.peakPlayers||0),peakAt:p.data?.peakAt||null,rankHistory:rh.data||[],loading:false};render()}catch{state.error='That game could not be loaded.';state.selected={gameId:String(id),loading:false};render()}}
function currentRank(g){return g.rankings?.[state.period==='week'?'weekly':state.period==='month'?'monthly':state.period==='year'?'yearly':'live']||g.rankings?.live||null}
function detailMarkup(g){if(g.loading)return '<div class="banner">Loading game details...</div>';const liveRank=g.rankings?.live||null;const periodRank=currentRank(g);const current=Number(g.currentPlayers||liveRank?.score||0);const trend=trendInsights(current,g.history||[]);const set=saved();const dataSince=(g.history||[])[0]?.at||null;const freshnessAt=g.currentSnapshotAt||liveRank?.calculatedAt||null;const periodRankChange=periodRank?.rankChange;const rankText=periodRank?.rank?('#'+periodRank.rank):'Not ranked';const peakText=g.peak?fmt(g.peak):'Not recorded';return '<div class="detail"><button class="back" onclick="navigate(\\'home\\')">← Back to rankings</button><section class="detail-head">'+gameIcon(g,true)+'<div class="detail-heading"><div class="eyebrow">GAME DETAILS</div><h1>'+esc(g.name)+'</h1><p>by '+esc(g.creator||'Unknown creator')+'</p><div class="head-actions"><a class="link-btn primary" href="https://www.roblox.com/games/'+encodeURIComponent(g.placeId||0)+'" target="_blank" rel="noreferrer">Open on Roblox ↗</a><button class="link-btn" onclick="toggleSave(\\''+g.gameId+'\\')">'+(set.has(g.gameId)?'Saved on this device':'Save game')+'</button><button class="link-btn" onclick="shareGame(\\''+g.gameId+'\\')">Share rank card</button><button class="link-btn" onclick="toggleCompare(\\''+g.gameId+'\\')">'+(state.compare.includes(g.gameId)?'Remove from compare':'Compare')+'</button></div></div></section><section class="stats"><div class="stat"><span>Current Players</span><strong>'+fmt(current)+'</strong><small>'+rel(freshnessAt)+' · '+(freshnessAt&&((Date.now()-new Date(freshnessAt).getTime())/1000<=900)?'fresh':'stale')+'</small></div><div class="stat"><span>Current Rank</span><strong>'+rankText+'</strong><small>'+(periodRankChange==null?'No prior rank':(periodRankChange>0?'▲ '+periodRankChange+' since last refresh':periodRankChange<0?'▼ '+Math.abs(periodRankChange)+' since last refresh':'No movement'))+'</small></div><div class="stat"><span>Recorded Peak</span><strong>'+peakText+' <sup title="Recorded Peak is the highest player count Bobaks has recorded. It is not a claim of Roblox-wide all-time history.">ⓘ</sup></strong><small>'+dateFmt(g.peakAt)+' · collected snapshots</small></div><div class="stat"><span>History shown since</span><strong>'+dateFmt(dataSince)+'</strong><small>'+((g.history||[]).length)+' collected points</small></div></section><section class="panel"><div class="panel-head"><div><h2>What is happening?</h2><p>Recent signals based on the history Bobaks has collected.</p></div></div><div class="insight-grid"><div class="insight"><span>7-day average</span><strong>'+fmt1(trend.avg7||0)+'</strong></div><div class="insight"><span>Vs 7-day average</span><strong class="'+((trend.pct||0)>=0?'up':'down')+'">'+(trend.pct==null?'Not enough data':((trend.pct>=0?'+':'')+fmt1(trend.pct)+'%'))+'</strong></div><div class="insight"><span>Vs 30-day average</span><strong class="'+((trend.unusual||0)>=0?'up':'down')+'">'+(trend.unusual==null?'Not enough data':((trend.unusual>=0?'+':'')+fmt1(trend.unusual)+'%'))+'</strong></div><div class="insight"><span>'+esc(periods.find(x=>x[0]===state.period)?.[1]||'Live')+' rank</span><strong>'+rankText+'</strong></div></div></section><section class="panel"><div class="panel-head"><div><h2>Player Count</h2><p>'+historyText(g.historyResolution)+'</p></div></div><div class="chart-wrap">'+playerChart(g.history||[])+'</div></section><section class="panel"><div class="panel-head"><div><h2>Rank History</h2><p>Daily rank calculated from the collected history.</p></div></div><div class="chart-wrap">'+rankChart(g.rankHistory||[])+'</div></section><section class="panel"><div class="panel-head"><div><h2>Game information</h2><p>Metadata stored by Bobaks for identification and linking.</p></div></div><div class="meta-grid"><div class="meta"><span>Universe ID</span><strong>'+esc(g.universeId||'Not available')+'</strong></div><div class="meta"><span>Place ID</span><strong>'+esc(g.placeId||'Not available')+'</strong></div><div class="meta"><span>Creator</span><strong>'+esc(g.creatorName||g.creator||'Unknown')+'</strong></div><div class="meta"><span>Created on Roblox</span><strong>'+dateFmt(g.createdAt)+'</strong></div></div>'+(g.description?'<div class="rule-box"><strong>Description</strong><span>'+esc(g.description)+'</span></div>':'')+'</section><section class="panel"><div class="panel-head"><div><h2>Data notes</h2><p>How to interpret the page.</p></div></div><div class="rule-box"><strong>Recorded Peak</strong><span>Highest player count Bobaks has recorded for this game in its collected snapshots.</span></div><div class="rule-box"><strong>Freshness</strong><span>Live rankings require a qualifying snapshot no older than 15 minutes at ranking calculation time.</span></div><div class="rule-box"><strong>History resolution</strong><span>'+historyText(g.historyResolution)+'</span></div></section></div>'}

async function renderMethodology(){if(!state.methodology){try{state.methodology=await api('/api/rankings/methodology');state.audit=await api('/api/rankings/audit')}catch{state.methodology=null}}if(!state.methodology)return '<div class="info"><button class="back" onclick="navigate(\\'home\\')">← Back to rankings</button><h1>How Bobaks Rankings Work</h1><p class="info-intro">The published methodology could not be loaded right now.</p></div>';const m=state.methodology,a=state.audit||{},score=m.score||{},elig=m.eligibility||{},runs=m.collectionRuns||{},ord=m.ordering||{},act=m.activity||{},integ=m.integrity||{};return '<div class="info"><button class="back" onclick="navigate(\\'home\\')">← Back to rankings</button><div class="eyebrow">BOBAKS RANKING · TRANSPARENCY</div><h1>How Bobaks Rankings Work</h1><p class="info-intro">Current published rules, live audit metadata, data qualification, and limitations.</p><div class="disclaimer">Not affiliated with, endorsed by, or sponsored by Roblox Corporation.</div><section class="info-section"><h2>Ranking periods</h2>'+ruleBox('Live',score.live)+ruleBox('Weekly',score.weekly)+ruleBox('Monthly',score.monthly)+ruleBox('Yearly',score.yearly)+'</section><section class="info-section"><h2>Eligibility</h2>'+ruleBox('Live',elig.live)+ruleBox('Weekly','Minimum '+(elig.weekly?.minimumSamples||12)+' samples and '+Math.round((elig.weekly?.minimumCoverage||.5)*100)+'% coverage.')+ruleBox('Monthly','Minimum '+(elig.monthly?.minimumSamples||12)+' samples and '+Math.round((elig.monthly?.minimumCoverage||.5)*100)+'% coverage.')+ruleBox('Yearly',elig.yearly)+'</section><section class="info-section"><h2>Ordering and movement</h2>'+ruleBox('Top N',String(m.topN||100))+ruleBox('Primary',ord.primary)+ruleBox('Tie-break',ord.tieBreak)+'<p style="margin-top:10px">Rank movement compares a game with the previous persisted ranking set. A missing previous rank is shown as NEW.</p></section><section class="info-section"><h2>Game activity</h2>'+ruleBox('Discovery',act.discovery)+ruleBox('Verification',act.staleVerification)+ruleBox('Deactivation',act.deactivation)+ruleBox('Reactivation',act.reactivation)+'</section><section class="info-section"><h2>Integrity and audit</h2>'+ruleBox('Audit status',a.auditStatus||'unknown')+ruleBox('Audited at',a.auditedAt||'unknown')+ruleBox('Validation',integ.validation)+ruleBox('Failure behavior',integ.failureBehavior)+'</section><section class="info-section"><h2>Limitations</h2>'+listSection(m.limitations||[])+'</section><div class="audit-line">Methodology version: '+esc(m.methodologyVersion||'unknown')+'</div></div>'}

async function shareGame(id){try{let g=state.selected?.gameId===String(id)?state.selected:null;if(!g||g.loading)g=(await api('/api/games/'+encodeURIComponent(id))).data;const rank=currentRank(g);const peak=(state.selected?.peak||0);const current=Number(g.currentPlayers||rank?.score||0);const rankText=rank?.rank?'#'+rank.rank:'Not ranked';const movement=rank?.rankChange==null?'NEW':rank.rankChange>0?'▲ '+rank.rankChange+' since last refresh':rank.rankChange<0?'▼ '+Math.abs(rank.rankChange)+' since last refresh':'No movement';const text='Bobaks Ranking · '+g.name+' · '+rankText+' · '+fmt(current)+' players · Peak '+fmt(peak)+' · '+movement;const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=675;const ctx=canvas.getContext('2d');ctx.fillStyle='#0b0f14';ctx.fillRect(0,0,1200,675);ctx.fillStyle='#ff4141';ctx.font='900 24px system-ui';ctx.fillText('BOBAKS RANKING',70,78);ctx.fillStyle='#eef2f7';ctx.font='900 52px system-ui';ctx.fillText(String(g.name).slice(0,28),70,170);ctx.fillStyle='#8d97a5';ctx.font='700 22px system-ui';ctx.fillText(String(g.creator||'Unknown creator').slice(0,48),70,208);ctx.fillStyle='#eef2f7';ctx.font='900 42px system-ui';ctx.fillText(rankText,70,300);ctx.fillText(fmt(current)+' players',420,300);ctx.font='800 28px system-ui';ctx.fillText('Peak '+fmt(peak),70,365);ctx.fillText(movement,420,365);ctx.fillStyle='#596472';ctx.font='700 18px system-ui';ctx.fillText('Live rankings and historical trends for Roblox experiences.',70,585);ctx.fillText('Independent fan-made analytics site · Bobaks Ranking',70,620);const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));if(navigator.share&&blob){try{const file=new File([blob],'bobaks-rank-card.png',{type:'image/png'});await navigator.share({title:'Bobaks Rank Card',text,files:[file]});return}catch{}}if(navigator.clipboard){await navigator.clipboard.writeText(text);state.error='Rank card text copied to your clipboard.';render()}}catch{state.error='Sharing is unavailable right now.';render()}}
function render(){const app=document.getElementById('app');updateNav();if(state.view==='detail'){app.innerHTML=detailMarkup(state.selected||{loading:true});return}if(state.view==='watchlist'){app.innerHTML='<div class="banner">Loading your saved games...</div>';renderWatchlist();return}if(state.view==='compare'){app.innerHTML='<div class="banner">Loading comparison...</div>';renderCompare();return}if(state.view==='info'){app.innerHTML=infoPage(state.infoKey);return}app.innerHTML=renderHome();const q=document.getElementById('q');if(q){q.oninput=e=>{state.query=e.target.value;clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>searchGames(state.query),250)}}}
loadState();render();loadRankings();setInterval(()=>{if(state.view==='home'||state.view==='detail')render()},1000);
</script>
