<style>
:root{
  --brand:#022359;
  --accent:#019EFB;
  --page:#050B14;
  --surface:#091527;
  --surface-2:#0B1B31;
  --surface-3:#0E223D;
  --line:rgba(176,213,255,.12);
  --line-strong:rgba(1,158,251,.38);
  --text:#F7FAFF;
  --muted:#8FA5C0;
  --muted-2:#6E829D;
  --positive:#37D6A2;
  --negative:#FF7586;
  --warning:#F4C95D;
  --toggle-bg:rgba(255,255,255,.08);
  --toggle-text:#DDE8F5;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:var(--page);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px;background:var(--page);color:var(--text)}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.top{
  height:72px;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(16px,4vw,42px);
  background:var(--brand);
  border-bottom:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 36px rgba(0,0,0,.18);
}
.brand{
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0;
  font-family:Manrope,Inter,sans-serif;
  font-size:15px;
  font-weight:800;
  letter-spacing:-.02em;
}
.brand .brand-accent{color:var(--accent)}
.mark{
  width:40px;
  height:40px;
  border-radius:12px;
  display:block;
  object-fit:cover;
  flex:none;
  box-shadow:0 4px 14px rgba(0,0,0,.22);
}
.nav{display:flex;align-items:center;gap:6px}
.nav button,.nav .nav-link,.btn{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:#DDE8F5;
  border-radius:10px;
  padding:9px 12px;
  font-size:12px;
  font-weight:700;
  transition:.18s ease;
}
.nav button:hover,.nav .nav-link:hover,.btn:hover{border-color:rgba(1,158,251,.55);transform:translateY(-1px)}
.nav button.active,.nav .nav-link.active{
  color:#fff;
  background:var(--accent);
  border-color:var(--accent);
  box-shadow:0 8px 20px rgba(1,158,251,.22);
}
.wrap{width:min(1320px,calc(100% - 32px));margin:auto;padding:32px 0 50px}
.hero{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.09);
  background:var(--brand);
  border-radius:20px;
  padding:28px clamp(20px,4vw,44px);
  margin-bottom:20px;
  box-shadow:0 22px 60px rgba(0,0,0,.24);
}
.hero:after{
  content:"";
  position:absolute;
  width:360px;height:360px;
  right:-110px;top:-150px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(1,158,251,.22),transparent 70%);
  pointer-events:none;
}
.hero-main{position:relative;z-index:1;max-width:760px}
.eyebrow{
  color:#A8DFFF;
  font-size:10px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.hero h1{
  font-family:Manrope,Inter,sans-serif;
  font-size:clamp(38px,6vw,68px);
  line-height:.98;
  margin:10px 0 10px;
  letter-spacing:-.055em;
}
.hero em{color:var(--accent);font-style:normal}
.hero p{margin:0;color:#C4D6EA;font-size:14px;line-height:1.65;max-width:650px}
.hero-status{
  position:absolute;
  z-index:1;
  right:24px;bottom:24px;
  min-width:230px;
  padding:13px 15px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:13px;
  background:rgba(3,16,39,.42);
  backdrop-filter:blur(10px);
}
.hero-status .status-label{display:block;color:#9FB6D0;font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.hero-status strong{display:block;margin-top:4px;font-size:12px}
.controls{
  display:flex;
  gap:12px;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.tabs{
  display:flex;
  gap:4px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface);
  overflow:auto;
}
.tabs button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px 16px;
  border-radius:9px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  transition:.18s ease;
}
.tabs button:hover{color:#fff}
.tabs button.active{
  color:#fff;
  background:var(--accent);
  box-shadow:0 8px 18px rgba(1,158,251,.18);
}
.btn{
  background:var(--surface);
  border-color:var(--line);
  color:#E4EEF9;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 9px 22px rgba(1,158,251,.2)}
.btn.ghost{background:transparent}
.social-actions{display:flex;align-items:center;gap:8px}
.social-status{min-height:16px;margin:7px 0 0;color:var(--muted-2);font-size:9px;line-height:1.4}
.social-status.show{color:var(--accent)}
.social-peaks{margin-bottom:18px;padding:17px}
.community-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}
.community-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);min-width:0}
.community-card.community-primary{grid-column:1 / -1;background:linear-gradient(135deg,var(--brand),var(--surface-2));border-color:var(--line-strong)}
.community-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-3);border:1px solid var(--line);color:#A8DFFF;font-weight:900}
.community-label{color:#A8DFFF;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.community-card h2{margin:0;font-family:Manrope,Inter,sans-serif;font-size:16px}
.community-card p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.55}
.community-card .btn{white-space:nowrap}
.community-disabled{cursor:default;opacity:.72}
.community-note{margin-bottom:18px}
.community-note h2{margin:0 0 5px;font-family:Manrope,Inter,sans-serif;font-size:16px}
.community-note p{margin:0;color:var(--muted);font-size:10px;line-height:1.6}
.social-peaks-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.social-peaks h2{margin:4px 0 0;font-family:Manrope,Inter,sans-serif;font-size:16px}
.social-peaks p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.5}
@media(max-width:760px){
  .social-peaks-head{align-items:flex-start;flex-direction:column}.social-peaks-head .btn{width:100%}
  .community-grid{grid-template-columns:1fr}
  .community-card.community-primary{grid-column:auto}
  .community-card{grid-template-columns:auto minmax(0,1fr);align-items:start}
  .community-card .btn{grid-column:1 / -1;width:100%}
  .nav{max-width:60vw;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
}
@media(max-width:760px){.social-actions{width:100%}.social-actions .btn{flex:1}.social-status{font-size:10px}}
.search{position:relative;margin-bottom:18px}
.search-wrap{position:relative}
.search-icon{
  position:absolute;left:15px;top:50%;
  transform:translateY(-50%);
  color:#83A4C9;font-size:15px;pointer-events:none
}
.search input{
  width:100%;
  height:48px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
  color:#fff;
  padding:0 15px 0 42px;
  outline:none;
  transition:.18s ease;
}
.search input::placeholder{color:#68809F}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(1,158,251,.1)}
.results{
  position:absolute;left:0;right:0;top:54px;
  z-index:15;
  background:var(--surface-2);
  border:1px solid var(--line-strong);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.35)
}
.results:empty{display:none}
.results button{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:#fff;text-align:left;padding:11px 13px}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--surface-3)}
.results b{font-size:12px}
.results small{color:var(--muted);font-size:9px}
.dashboard{
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:18px;
  align-items:start;
}
.main-card,.side-card{
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--surface);
  box-shadow:0 14px 38px rgba(0,0,0,.15)
}
.main-card{overflow:hidden}
.listhead{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-end;
  padding:19px 20px 14px;
}
.listhead h2{
  font-family:Manrope,Inter,sans-serif;
  margin:0;
  font-size:18px;
  letter-spacing:-.025em
}
.listhead p{margin:4px 0 0;color:var(--muted-2);font-size:10px}
.updated{color:#8AA4C1;font-size:9px;text-align:right}
.table-head{
  display:grid;
  grid-template-columns:54px minmax(280px,1.6fr) minmax(130px,.7fr) 110px 92px 120px;
  gap:10px;
  align-items:center;
  padding:11px 20px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  color:#6F89A6;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.1em;
  font-weight:800
}
.table-head span:nth-last-child(-n+2){text-align:right}
.rows{border-top:0}
.row{
  display:grid;
  grid-template-columns:54px minmax(280px,1.6fr) minmax(130px,.7fr) 110px 92px 120px;
  gap:10px;
  align-items:center;
  min-height:78px;
  padding:9px 20px;
  border-bottom:1px solid var(--line);
  transition:.16s ease;
}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(1,158,251,.045)}
.row:first-child{background:linear-gradient(90deg,rgba(1,158,251,.12),transparent 72%);box-shadow:inset 3px 0 0 var(--accent)}
.row.refreshing{animation:rowRefresh .45s ease both}
.row.value-changed{background:linear-gradient(90deg,rgba(1,158,251,.11),rgba(1,158,251,.025) 55%,transparent);animation:rowRefresh .55s ease both}
.row.value-changed .players b{animation:valuePulse .65s ease both}
.row.value-changed .game img{animation:imageLift .55s ease both}
.row:first-child .game img{box-shadow:0 0 0 2px rgba(1,158,251,.25),0 8px 20px rgba(1,158,251,.18)}
.row:first-child .game b{color:#fff}
.top-badge{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:2px 6px;border-radius:99px;background:rgba(244,201,93,.12);border:1px solid rgba(244,201,93,.24);color:var(--warning);font-size:7px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;vertical-align:middle}
.top-badge.rank-2{background:rgba(207,214,223,.10);border-color:rgba(207,214,223,.24);color:#D8DEE6}
.top-badge.rank-3{background:rgba(184,115,51,.10);border-color:rgba(184,115,51,.24);color:#D79A63}
.movement-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:99px;background:rgba(255,255,255,.035);border:1px solid transparent;animation:movementPop .5s ease both}
.up.movement-badge{background:rgba(55,214,162,.08);border-color:rgba(55,214,162,.16)}
.down.movement-badge{background:rgba(255,117,134,.08);border-color:rgba(255,117,134,.16)}
.new.movement-badge{background:rgba(191,167,255,.09);border-color:rgba(191,167,255,.16)}
.live-value{display:inline-block;min-width:4ch}
.live-pulse{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--positive);box-shadow:0 0 0 0 rgba(55,214,162,.38);animation:livePulse 1.8s infinite;vertical-align:1px}
.moving-section{margin:0 0 18px}
.moving-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px}
.moving-head h2{margin:0;font-family:Manrope,Inter,sans-serif;font-size:17px;letter-spacing:-.025em}
.moving-head p{margin:4px 0 0;color:var(--muted-2);font-size:10px}
.moving-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.moving-card{
  position:relative;min-width:0;
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(145deg,var(--surface),#07111F);
  box-shadow:0 12px 30px rgba(0,0,0,.12);
  transition:.18s ease;
  animation:cardRise .45s ease both
}
.moving-card:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.moving-card,.moving-card:visited,.moving-card:hover,.moving-card:focus{color:var(--text);text-decoration:none}
.moving-card-head{display:flex;align-items:center;gap:10px}
.moving-card img{width:48px;height:48px;border-radius:11px;object-fit:cover;background:#10223A;flex:none}
.moving-info{min-width:0;text-align:left}
.moving-info b,.moving-info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moving-info b{font-size:11px;color:#F7FAFF;font-weight:800}
.moving-info small{margin-top:3px;color:#A9BDD5;font-size:8px}
.moving-rank{margin-left:auto;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:rgba(1,158,251,.08);color:#BBD9F4;font-size:10px;font-weight:850}
.moving-change{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:9px}
.moving-change strong{font-size:10px}
.moving-bar{height:4px;margin-top:8px;border-radius:99px;background:#0D2036;overflow:hidden}
.moving-bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#58C7FF);transform-origin:left center;animation:barGrow .65s ease both}
.moving-label{display:block;color:var(--muted-2);font-size:8px;margin-top:5px}
.load-more-wrap{display:flex;justify-content:center;margin:12px 0 0}
.ranking-body + .load-more-wrap{margin-bottom:24px;padding-bottom:24px}
.load-more-btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:#9FB4CC;
  border-radius:10px;
  padding:9px 18px;
  font-size:10px;
  font-weight:800;
  transition:.18s ease
}
.load-more-btn:hover{color:#fff;border-color:var(--accent);background:var(--surface-2)}
.rank-toggle{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line);
  background:var(--surface);
  color:#AFC2D8;
  border-radius:10px;
  padding:8px 11px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  transition:.18s ease
}
.rank-toggle:hover{color:#fff;border-color:var(--accent)}
.rank-chevron{display:inline-block;font-size:12px;transition:transform .18s ease}
.rank-toggle.collapsed .rank-chevron{transform:rotate(-90deg)}
.ranking-body.collapsed{display:none}
html[data-theme="light"] .load-more-btn,
html[data-theme="light"] .rank-toggle{color:#355774;background:#fff;border-color:rgba(2,35,89,.14)}
html[data-theme="light"] .load-more-btn:hover,
html[data-theme="light"] .rank-toggle:hover{color:#14304D;border-color:var(--accent)}
@keyframes rowRefresh{0%{opacity:.55;transform:translateY(3px)}100%{opacity:1;transform:none}}
@keyframes valuePulse{0%{transform:scale(.96);color:#A9C7E6}45%{transform:scale(1.06);color:#fff}100%{transform:scale(1);color:inherit}}
@keyframes movementPop{0%{opacity:0;transform:scale(.82)}70%{transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
@keyframes imageLift{0%{transform:scale(.97)}55%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(55,214,162,.34)}50%{box-shadow:0 0 0 5px rgba(55,214,162,0)}}
@keyframes cardRise{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:none}}
@keyframes barGrow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
.row img,.cover{
  width:54px;height:54px;border-radius:12px;object-fit:cover;
  background:#10223A;
}
.game{
  border:0;
  background:transparent;
  color:var(--text);
  text-align:left;
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0;
}
.game span{min-width:0}
.game b,.game small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game b{font-size:12px;font-weight:750}
.game small{color:var(--muted-2);font-size:9px;margin-top:4px}
.game-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;border:1px solid rgba(1,158,251,.2);background:rgba(1,158,251,.08);color:#8FCCF3;padding:3px 7px;border-radius:99px;font-size:8px;font-weight:700}
.rank{
  width:30px;height:30px;margin:auto;
  display:grid;place-items:center;
  border-radius:9px;
  color:#7C94AE;
  font-weight:850;font-size:11px;
}
.row:first-child .rank{color:#fff;background:var(--accent);box-shadow:0 7px 16px rgba(1,158,251,.2)}
.players{text-align:right;white-space:nowrap}
.players b{display:block;font-size:12px}
.players small{color:var(--muted-2);font-size:9px}
.movement{text-align:right;font-size:10px;font-weight:850}
.up{color:var(--positive)}
.down{color:var(--negative)}
.new{color:#BFA7FF}
.creator{min-width:0;color:#A5B8CE;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:5px;justify-content:flex-end}
.mini{
  border:1px solid var(--line);
  background:#0D1B2D;
  color:#9FB4CC;
  border-radius:8px;
  padding:7px 9px;
  font-size:9px;
  font-weight:700;
  transition:.16s ease
}
.mini:hover{border-color:var(--accent);color:#fff}
.empty{text-align:center;padding:62px 20px;color:#7188A3;font-size:12px}
.banner{
  padding:11px 13px;margin-bottom:13px;
  border:1px solid var(--line);border-radius:11px;
  background:var(--surface);color:#9FB2C8;font-size:11px
}
.error{color:#FFB7BF;border-color:rgba(255,117,134,.32);background:rgba(93,23,37,.3)}
.side-stack{display:grid;gap:12px}
.side-card{padding:16px}
.side-card h3{margin:0;font-family:Manrope,Inter,sans-serif;font-size:13px;letter-spacing:-.01em}
.side-card p{margin:6px 0 0;color:var(--muted);font-size:10px;line-height:1.6}
.side-top{display:flex;align-items:center;gap:11px}
.side-icon{
  width:38px;height:38px;border-radius:11px;
  display:grid;place-items:center;
  background:rgba(1,158,251,.12);
  color:var(--accent);
  font-size:17px
}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--positive);display:inline-block;box-shadow:0 0 0 4px rgba(55,214,162,.1)}
.data-list{margin:13px 0 0;padding:0;list-style:none;display:grid;gap:9px}
.data-list li{display:flex;justify-content:space-between;gap:10px;color:#ADC0D5;font-size:10px}
.data-list strong{color:#EEF6FF;font-size:10px}
.health{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.health-row{display:flex;align-items:center;gap:9px;color:#B9CCDF;font-size:10px}
.health small{display:block;margin-top:6px;color:var(--muted-2);font-size:9px;line-height:1.5}
.about-link{display:inline-flex;margin-top:10px;color:var(--accent);font-size:10px;font-weight:800}
.detail-head{
  display:flex;gap:17px;align-items:flex-start;
  padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--brand);
}
.detail-head h1{font-family:Manrope,Inter,sans-serif;margin:5px 0 4px;font-size:clamp(28px,5vw,44px);letter-spacing:-.05em}
.detail-head p{margin:0 0 12px;color:#B9CCE3;font-size:11px}
.actions-wide{display:flex;gap:7px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:15px}
.stat span,.stat small{color:var(--muted-2);font-size:9px}
.stat strong{display:block;margin:7px 0 3px;font-family:Manrope,Inter,sans-serif;font-size:20px;letter-spacing:-.03em}
.panel{border:1px solid var(--line);border-radius:15px;background:var(--surface);padding:17px;margin-bottom:12px}
.panel h2{margin:0;font-family:Manrope,Inter,sans-serif;font-size:15px}
.panel p{color:var(--muted);font-size:10px;line-height:1.6}
.chart{height:210px}
.chart svg{width:100%;height:190px}
.line{stroke:var(--accent);stroke-width:3;fill:none}
.rankline{stroke:#86B8FF;stroke-width:3;fill:none}
.gridline{stroke:rgba(176,213,255,.11)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta div{padding:11px;border:1px solid var(--line);border-radius:10px;background:#0A192C}
.meta small{display:block;color:var(--muted-2);font-size:8px}
.meta b{font-size:10px;word-break:break-word}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.info{max-width:900px}
.info h1{font-family:Manrope,Inter,sans-serif;font-size:clamp(30px,5vw,44px);margin:10px 0;letter-spacing:-.05em}
.info p{color:#91A8C3;font-size:12px;line-height:1.8}
.foot{
  margin-top:22px;padding-top:18px;
  border-top:1px solid var(--line);
  color:#647C98;font-size:9px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap
}
.foot button{border:0;background:none;color:#7E97B3;font-size:9px;padding:0}
.foot button:hover{color:var(--accent)}

.rank-card-modal{
  position:fixed;inset:0;z-index:100;
  display:grid;place-items:center;
  padding:16px;
  background:
    radial-gradient(circle at 50% 8%,rgba(1,158,251,.07),transparent 38%),
    rgba(2,7,14,.9);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.rank-card-dialog{
  position:relative;
  width:min(500px,100%);
  max-height:calc(100dvh - 28px);
  overflow:auto;
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  background:
    linear-gradient(180deg,rgba(13,29,51,.96),rgba(6,15,27,.985));
  box-shadow:
    0 34px 110px rgba(0,0,0,.62),
    0 0 0 1px rgba(1,158,251,.035);
  padding:18px;
  scrollbar-width:thin;
  scrollbar-color:rgba(143,165,192,.25) transparent;
}
.rank-card-dialog::-webkit-scrollbar{width:8px}
.rank-card-dialog::-webkit-scrollbar-track{background:transparent}
.rank-card-dialog::-webkit-scrollbar-thumb{background:rgba(143,165,192,.2);border-radius:99px}
.rank-card-dialog-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  margin-bottom:13px;
}
.rank-card-dialog-copy{min-width:0}
.rank-card-dialog-title{
  margin:0;
  color:#F6FAFF;
  font-family:Manrope,Inter,sans-serif;
  font-size:11px;
  font-weight:900;
  line-height:1.2;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.rank-card-dialog-sub{
  margin:6px 0 0;
  color:#E7F1FC;
  font-size:16px;
  line-height:1.25;
  font-weight:850;
  letter-spacing:-.018em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.rank-card-live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:7px;
  color:#87A3BE;
  font-size:9px;
  line-height:1.2;
  font-weight:750;
}
.rank-card-live-dot{
  width:7px;height:7px;border-radius:50%;
  background:#37D6A2;
  box-shadow:0 0 0 4px rgba(55,214,162,.08),0 0 12px rgba(55,214,162,.22);
  flex:none;
}
.rank-card-close{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.045);
  color:#BFD2E7;
  width:34px;height:34px;border-radius:10px;
  font-size:18px;line-height:1;
  flex:none;
  transition:.18s ease;
}
.rank-card-close:hover{
  color:#fff;
  border-color:rgba(1,158,251,.4);
  background:rgba(1,158,251,.08);
  transform:translateY(-1px);
}
.rank-card-close:focus-visible{
  outline:2px solid rgba(1,158,251,.75);
  outline-offset:2px;
}
.rank-card-canvas-wrap{
  position:relative;
  isolation:isolate;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:260px;
  padding:17px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.09);
  background:
    radial-gradient(circle at 50% 28%,rgba(255,255,255,.035),transparent 44%),
    linear-gradient(145deg,#0C1A2E,#05101C 68%,#07111F);
  overflow:hidden;
}
.rank-card-canvas-wrap::before,
.rank-card-canvas-wrap::after{
  content:"";
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-44%);
  width:76%;height:62%;
  border-radius:50%;
  pointer-events:none;
  z-index:-1;
}
.rank-card-canvas-wrap::before{
  background:radial-gradient(circle,rgba(1,158,251,.18),transparent 68%);
  filter:blur(24px);
}
.rank-card-canvas-wrap::after{
  border:1px solid rgba(255,255,255,.045);
  box-shadow:inset 0 0 50px rgba(255,255,255,.018);
}
.rank-card-canvas-wrap[data-tier="gold"]::before{background:radial-gradient(circle,rgba(244,201,93,.34),transparent 70%);filter:blur(28px)}
.rank-card-canvas-wrap[data-tier="purple"]::before{background:radial-gradient(circle,rgba(191,167,255,.27),transparent 70%)}
.rank-card-canvas-wrap[data-tier="blue"]::before{background:radial-gradient(circle,rgba(86,203,255,.24),transparent 70%)}
.rank-card-canvas-wrap[data-tier="green"]::before{background:radial-gradient(circle,rgba(55,214,162,.2),transparent 70%)}
.rank-card-canvas-wrap[data-tier="white"]::before{background:radial-gradient(circle,rgba(211,222,233,.17),transparent 70%)}
.rank-card-canvas{
  position:relative;
  z-index:2;
  display:block;
  width:min(100%,392px);
  height:auto;
  border-radius:13px;
  background:#06101D;
  box-shadow:0 28px 52px rgba(0,0,0,.46),0 4px 18px rgba(0,0,0,.28);
}
.rank-card-canvas-wrap[data-tier="gold"] .rank-card-canvas{box-shadow:0 30px 62px rgba(0,0,0,.5),0 0 38px rgba(244,201,93,.12)}
.rank-card-canvas-wrap[data-tier="purple"] .rank-card-canvas{box-shadow:0 28px 56px rgba(0,0,0,.48),0 0 34px rgba(191,167,255,.09)}
.rank-card-canvas-wrap[data-tier="blue"] .rank-card-canvas{box-shadow:0 28px 56px rgba(0,0,0,.48),0 0 34px rgba(86,203,255,.08)}
.rank-card-canvas-wrap[data-tier="green"] .rank-card-canvas{box-shadow:0 28px 56px rgba(0,0,0,.48),0 0 30px rgba(55,214,162,.08)}
.rank-card-canvas-wrap[data-tier="white"] .rank-card-canvas{box-shadow:0 28px 56px rgba(0,0,0,.48),0 0 28px rgba(211,222,233,.06)}
.rank-card-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}
.rank-card-actions .btn{
  width:100%;
  min-height:48px;
  justify-content:center;
  border-radius:12px;
  font-size:11px;
  font-weight:850;
  letter-spacing:.005em;
}
.rank-card-actions .btn.primary{
  box-shadow:0 12px 24px rgba(1,158,251,.2);
}
.rank-card-secondary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:10px 0 0;
}
.rank-card-secondary button{
  border:0;
  background:transparent;
  color:#A7BCD2;
  padding:3px 4px;
  font-size:9px;
  font-weight:800;
  transition:.16s ease;
}
.rank-card-secondary button:hover{color:#fff}
.rank-card-secondary button:focus-visible{outline:2px solid rgba(1,158,251,.65);outline-offset:2px;border-radius:5px}
.rank-card-secondary-sep{color:#526A84;font-size:11px}
.rank-card-section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  margin-top:20px;
}
.rank-card-section-title{
  margin:0;
  color:#F2F7FD;
  font-family:Manrope,Inter,sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.rank-card-section-sub{
  margin:4px 0 0;
  color:#7890A8;
  font-size:9px;
  line-height:1.45;
}
.rank-card-recommended{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
  margin-top:10px;
  padding:10px 11px;
  border:1px solid rgba(244,201,93,.16);
  border-radius:12px;
  background:linear-gradient(135deg,rgba(244,201,93,.07),rgba(255,255,255,.025));
}
.rank-card-recommended-copy{
  min-width:0;
  color:#B8CADC;
  font-size:9px;
  line-height:1.45;
}
.rank-card-recommended-copy strong{
  display:block;
  margin-bottom:2px;
  color:#F4C95D;
  font-size:8px;
  letter-spacing:.11em;
  text-transform:uppercase;
}
.rank-card-recommended-action{
  border:1px solid rgba(244,201,93,.28);
  background:rgba(244,201,93,.08);
  color:#FFE5A0;
  border-radius:9px;
  padding:8px 9px;
  font-size:8px;
  font-weight:850;
  white-space:nowrap;
  transition:.16s ease;
}
.rank-card-recommended-action:hover{
  background:rgba(244,201,93,.13);
  border-color:rgba(244,201,93,.4);
  transform:translateY(-1px);
}
.rank-card-platform-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin-top:9px;
}
.rank-card-platform-grid .platform{
  min-width:0;
  min-height:82px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:10px 6px;
  border-radius:13px;
  text-align:center;
  overflow:hidden;
}
.rank-card-platform-grid .platform:hover{
  transform:translateY(-2px);
}
.rank-card-platform-grid .platform strong{
  display:block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#ECF3FB;
  font-size:9px;
  line-height:1.1;
  font-weight:850;
}
.rank-card-platform-grid .platform small{
  display:block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#7890A8;
  font-size:7px;
  line-height:1.1;
  font-weight:750;
}
.platform-icon{
  width:29px;height:29px;
  display:grid;place-items:center;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  color:#AFC4D9;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}
.platform-icon svg{width:15px;height:15px;display:block}
[data-platform="messenger"]{background:linear-gradient(145deg,rgba(67,144,255,.11),rgba(255,255,255,.025));border-color:rgba(67,144,255,.18)}
[data-platform="messenger"] .platform-icon{color:#6DAAFF;background:rgba(67,144,255,.12);border-color:rgba(67,144,255,.2)}
[data-platform="instagram"]{background:linear-gradient(145deg,rgba(236,72,153,.1),rgba(122,75,255,.08) 55%,rgba(255,255,255,.025));border-color:rgba(194,92,219,.18)}
[data-platform="instagram"] .platform-icon{color:#EAA3FF;background:linear-gradient(145deg,rgba(236,72,153,.12),rgba(122,75,255,.1));border-color:rgba(218,115,235,.2)}
[data-platform="tiktok"]{background:linear-gradient(145deg,rgba(62,238,255,.08),rgba(255,75,110,.065),rgba(255,255,255,.025));border-color:rgba(116,220,232,.16)}
[data-platform="tiktok"] .platform-icon{color:#B9FFFF;background:linear-gradient(135deg,rgba(62,238,255,.11),rgba(255,75,110,.09));border-color:rgba(116,220,232,.19)}
[data-platform="whatsapp"]{background:linear-gradient(145deg,rgba(74,222,128,.095),rgba(255,255,255,.025));border-color:rgba(74,222,128,.17)}
[data-platform="whatsapp"] .platform-icon{color:#73E8A4;background:rgba(74,222,128,.11);border-color:rgba(74,222,128,.2)}
[data-platform="facebook"]{background:linear-gradient(145deg,rgba(59,130,246,.1),rgba(255,255,255,.025));border-color:rgba(59,130,246,.17)}
[data-platform="facebook"] .platform-icon{color:#83B8FF;background:rgba(59,130,246,.11);border-color:rgba(59,130,246,.2)}
[data-platform="x"]{background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border-color:rgba(255,255,255,.11)}
[data-platform="x"] .platform-icon{color:#F6FAFF;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.13)}
[data-platform="discord"]{background:linear-gradient(145deg,rgba(139,92,246,.1),rgba(255,255,255,.025));border-color:rgba(139,92,246,.17)}
[data-platform="discord"] .platform-icon{color:#B89DFF;background:rgba(139,92,246,.11);border-color:rgba(139,92,246,.2)}
[data-platform="native"]{background:linear-gradient(145deg,rgba(1,158,251,.075),rgba(255,255,255,.025));border-color:rgba(1,158,251,.16)}
[data-platform="native"] .platform-icon{color:#86D4FF;background:rgba(1,158,251,.1);border-color:rgba(1,158,251,.19)}
.rank-card-share-status{
  margin:10px 1px 0;
  padding:9px 10px;
  border:1px solid rgba(1,158,251,.18);
  border-radius:10px;
  background:rgba(1,158,251,.045);
  color:#AFC3D9;
  font-size:9px;
  line-height:1.5;
  text-align:center;
  display:none;
}
.rank-card-share-status.show{display:block}
.rank-card-note{
  margin:8px 1px 0;
  color:#5F7590;
  font-size:7px;
  line-height:1.45;
  text-align:center;
}
.rank-card-generating{
  display:grid;place-items:center;
  min-height:240px;
  color:#9CB2C9;
  font-size:11px;
  gap:8px;
}
.rank-card-generating .spinner{
  width:24px;height:24px;
  border:2px solid rgba(1,158,251,.2);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:rankSpin .8s linear infinite;
}
@keyframes rankSpin{to{transform:rotate(360deg)}}
@media(max-width:620px){
  .rank-card-modal{padding:8px}
  .rank-card-dialog{
    width:100%;
    max-height:calc(100dvh - 16px);
    border-radius:19px;
    padding:14px;
  }
  .rank-card-dialog-sub{font-size:15px}
  .rank-card-canvas-wrap{padding:12px;border-radius:17px}
  .rank-card-canvas{width:min(100%,345px)}
  .rank-card-actions{grid-template-columns:1fr}
  .rank-card-actions .btn{min-height:50px}
  .rank-card-secondary{margin-top:9px}
  .rank-card-section-head{margin-top:18px}
  .rank-card-section-title{font-size:10px}
  .rank-card-recommended{grid-template-columns:1fr}
  .rank-card-recommended-action{justify-self:start}
  .rank-card-platform-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .rank-card-platform-grid .platform{min-height:80px}
}
@media(max-width:1040px){
  .dashboard{grid-template-columns:1fr}
  .side-stack{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero-status{position:static;margin-top:18px;max-width:260px}
  .hero{padding-bottom:24px}
}
@media(max-width:900px){
  .moving-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .table-head{display:none}
  .row{
    grid-template-columns:38px minmax(0,1fr) 100px;
    min-height:84px;
    padding:10px 14px
  }
  .row .creator{display:none}
  .movement{grid-column:3;grid-row:1}
  .actions{grid-column:2/4;justify-content:flex-start}
  .players{grid-column:3;grid-row:1}
  .game{grid-column:2;grid-row:1}
  .stats{grid-template-columns:1fr 1fr}
  .side-stack{grid-template-columns:1fr}
}
@media(max-width:620px){
  .top{height:64px;padding:0 10px}
  .brand{font-size:13px}
  .mark{width:36px;height:36px;border-radius:11px}
  .nav button{padding:8px 9px;font-size:10px}
  .nav #savedNav span{display:none}
  .wrap{width:min(100% - 20px,1320px);padding-top:22px}
  .hero{border-radius:16px;padding:22px 18px}
  .hero h1{font-size:42px}
  .hero-status{min-width:0;width:100%}
  .controls{align-items:stretch;flex-direction:column}
  .tabs{width:100%}
  .tabs button{flex:1;padding:9px 10px}
  .controls>.btn{width:100%}
  .search{margin-bottom:14px}
  .moving-grid{grid-template-columns:1fr}
  .moving-head{align-items:flex-start;flex-direction:column}
  .main-card,.side-card,.detail-head,.panel,.stat{border-radius:13px}
  .listhead{padding:16px 14px 12px}
  .updated{text-align:left}
  .row{grid-template-columns:34px minmax(0,1fr) 84px;padding:9px 12px}
  .row img,.cover{width:48px;height:48px}
  .game{gap:9px}
  .game b{font-size:11px}
  .game small{font-size:8px}
  .players b{font-size:11px}
  .actions{gap:4px}
  .mini{padding:6px 8px}
  .detail-head{padding:16px}
  .detail-head h1{font-size:28px}
  .stats{gap:8px}
  .stat{padding:12px}
  .compare,.meta{grid-template-columns:1fr}
  .foot{display:block}
  .foot div+div{margin-top:8px}
}
html[data-theme="light"]{
  --page:#F4F7FB;
  --surface:#FFFFFF;
  --surface-2:#F4F8FD;
  --surface-3:#E9F2FB;
  --line:rgba(2,35,89,.12);
  --line-strong:rgba(1,158,251,.42);
  --text:#10233B;
  --muted:#5E7895;
  --muted-2:#6E8299;
  --toggle-bg:rgba(255,255,255,.14);
  --toggle-text:#FFFFFF;
}
html[data-theme="light"] body{background:var(--page);color:var(--text)}
html[data-theme="light"] .top{box-shadow:0 10px 30px rgba(2,35,89,.12)}
html[data-theme="light"] .main-card,
html[data-theme="light"] .side-card,
html[data-theme="light"] .stat,
html[data-theme="light"] .panel{box-shadow:0 12px 30px rgba(2,35,89,.07)}
html[data-theme="light"] .table-head{color:#607A95}
html[data-theme="light"] .creator{color:#52708E}
html[data-theme="light"] .game small{color:#64809D}
html[data-theme="light"] .players small{color:#64809D}
html[data-theme="light"] .updated{color:#58738F}
html[data-theme="light"] .mini{background:#F4F8FC;color:#45627E}
html[data-theme="light"] .meta div{background:#F5F9FD}
html[data-theme="light"] .search input{background:#FFFFFF;color:#10233B}
html[data-theme="light"] .search input::placeholder{color:#7890A9}
html[data-theme="light"] .results{background:#FFFFFF;box-shadow:0 18px 50px rgba(2,35,89,.14)}
html[data-theme="light"] .results button:hover{background:#EAF3FC}
html[data-theme="light"] .moving-card{background:linear-gradient(145deg,#FFFFFF,#F2F7FC)}
html[data-theme="light"] .moving-info b{color:#10233B}
html[data-theme="light"] .moving-info small{color:#5C7793}
html[data-theme="light"] .moving-rank{background:rgba(1,158,251,.09);color:#2D587F}
html[data-theme="light"] .moving-bar{background:#DCEAF6}
html[data-theme="light"] .side-card p,
html[data-theme="light"] .panel p,
html[data-theme="light"] .info p{color:#607A95}
html[data-theme="light"] .data-list li{color:#4F6B88}
html[data-theme="light"] .data-list strong{color:#10233B}
html[data-theme="light"] .health-row{color:#42627E}
html[data-theme="light"] .health small{color:#66819C}
html[data-theme="light"] .foot{color:#66819C}
html[data-theme="light"] .foot button{color:#577490}
html[data-theme="light"] .row:hover{background:rgba(1,158,251,.055)}
