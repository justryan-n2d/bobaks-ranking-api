<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bobaks Ranking | Live Rankings & Historical Trends</title>
<meta name="description" content="Live rankings and historical trends for Roblox experiences.">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/bobaks-logo.png">
<link rel="apple-touch-icon" href="/assets/bobaks-logo.png">
<style>
:root{
  --brand:#022359;
  --accent:#019EFB;
  --page:#050B14;
  --surface:#091527;
  --surface-2:#0B1B31;
  --surface-3:#0E223D;
  --line:rgba(176,213,255,.12);
  --line-strong:rgba(1,158,251,.38);
  --text:#F7FAFF;
  --muted:#8FA5C0;
  --muted-2:#6E829D;
  --positive:#37D6A2;
  --negative:#FF7586;
  --warning:#F4C95D;
  --toggle-bg:rgba(255,255,255,.08);
  --toggle-text:#DDE8F5;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:var(--page);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px;background:var(--page);color:var(--text)}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.top{
  height:72px;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(16px,4vw,42px);
  background:var(--brand);
  border-bottom:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 36px rgba(0,0,0,.18);
}
.brand{
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0;
  font-family:Manrope,Inter,sans-serif;
  font-size:15px;
  font-weight:800;
  letter-spacing:-.02em;
}
.brand .brand-accent{color:var(--accent)}
.mark{
  width:40px;
  height:40px;
  border-radius:12px;
  display:block;
  object-fit:cover;
  flex:none;
  box-shadow:0 4px 14px rgba(0,0,0,.22);
}
.nav{display:flex;align-items:center;gap:6px}
.nav button,.btn{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:#DDE8F5;
  border-radius:10px;
  padding:9px 12px;
  font-size:12px;
  font-weight:700;
  transition:.18s ease;
}
.nav button:hover,.btn:hover{border-color:rgba(1,158,251,.55);transform:translateY(-1px)}
.nav button.active{
  color:#fff;
  background:var(--accent);
  border-color:var(--accent);
  box-shadow:0 8px 20px rgba(1,158,251,.22);
}
.wrap{width:min(1320px,calc(100% - 32px));margin:auto;padding:32px 0 50px}
.hero{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.09);
  background:var(--brand);
  border-radius:20px;
  padding:28px clamp(20px,4vw,44px);
  margin-bottom:20px;
  box-shadow:0 22px 60px rgba(0,0,0,.24);
}
.hero:after{
  content:"";
  position:absolute;
  width:360px;height:360px;
  right:-110px;top:-150px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(1,158,251,.22),transparent 70%);
  pointer-events:none;
}
.hero-main{position:relative;z-index:1;max-width:760px}
.eyebrow{
  color:#A8DFFF;
  font-size:10px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.hero h1{
  font-family:Manrope,Inter,sans-serif;
  font-size:clamp(38px,6vw,68px);
  line-height:.98;
  margin:10px 0 10px;
  letter-spacing:-.055em;
}
.hero em{color:var(--accent);font-style:normal}
.hero p{margin:0;color:#C4D6EA;font-size:14px;line-height:1.65;max-width:650px}
.hero-status{
  position:absolute;
  z-index:1;
  right:24px;bottom:24px;
  min-width:230px;
  padding:13px 15px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:13px;
  background:rgba(3,16,39,.42);
  backdrop-filter:blur(10px);
}
.hero-status .status-label{display:block;color:#9FB6D0;font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.hero-status strong{display:block;margin-top:4px;font-size:12px}
.controls{
  display:flex;
  gap:12px;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.tabs{
  display:flex;
  gap:4px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface);
  overflow:auto;
}
.tabs button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px 16px;
  border-radius:9px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  transition:.18s ease;
}
.tabs button:hover{color:#fff}
.tabs button.active{
  color:#fff;
  background:var(--accent);
  box-shadow:0 8px 18px rgba(1,158,251,.18);
}
.btn{
  background:var(--surface);
  border-color:var(--line);
  color:#E4EEF9;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 9px 22px rgba(1,158,251,.2)}
.btn.ghost{background:transparent}
.search{position:relative;margin-bottom:18px}
.search-wrap{position:relative}
.search-icon{
  position:absolute;left:15px;top:50%;
  transform:translateY(-50%);
  color:#83A4C9;font-size:15px;pointer-events:none
}
.search input{
  width:100%;
  height:48px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
  color:#fff;
  padding:0 15px 0 42px;
  outline:none;
  transition:.18s ease;
}
.search input::placeholder{color:#68809F}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(1,158,251,.1)}
.results{
  position:absolute;left:0;right:0;top:54px;
  z-index:15;
  background:var(--surface-2);
  border:1px solid var(--line-strong);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.35)
}
.results:empty{display:none}
.results button{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:#fff;text-align:left;padding:11px 13px}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--surface-3)}
.results b{font-size:12px}
.results small{color:var(--muted);font-size:9px}
.dashboard{
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:18px;
  align-items:start;
}
.main-card,.side-card{
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--surface);
  box-shadow:0 14px 38px rgba(0,0,0,.15)
}
.main-card{overflow:hidden}
.listhead{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-end;
  padding:19px 20px 14px;
}
.listhead h2{
  font-family:Manrope,Inter,sans-serif;
  margin:0;
  font-size:18px;
  letter-spacing:-.025em
}
.listhead p{margin:4px 0 0;color:var(--muted-2);font-size:10px}
.updated{color:#8AA4C1;font-size:9px;text-align:right}
.table-head{
  display:grid;
  grid-template-columns:54px minmax(280px,1.6fr) minmax(130px,.7fr) 110px 92px 120px;
  gap:10px;
  align-items:center;
  padding:11px 20px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  color:#6F89A6;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.1em;
  font-weight:800
}
.table-head span:nth-last-child(-n+2){text-align:right}
.rows{border-top:0}
.row{
  display:grid;
  grid-template-columns:54px minmax(280px,1.6fr) minmax(130px,.7fr) 110px 92px 120px;
  gap:10px;
  align-items:center;
  min-height:78px;
  padding:9px 20px;
  border-bottom:1px solid var(--line);
  transition:.16s ease;
}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(1,158,251,.045)}
.row:first-child{background:linear-gradient(90deg,rgba(1,158,251,.12),transparent 72%);box-shadow:inset 3px 0 0 var(--accent)}
.row.refreshing{animation:rowRefresh .45s ease both}
.row.value-changed{background:linear-gradient(90deg,rgba(1,158,251,.11),rgba(1,158,251,.025) 55%,transparent);animation:rowRefresh .55s ease both}
.row.value-changed .players b{animation:valuePulse .65s ease both}
.row.value-changed .game img{animation:imageLift .55s ease both}
.row:first-child .game img{box-shadow:0 0 0 2px rgba(1,158,251,.25),0 8px 20px rgba(1,158,251,.18)}
.row:first-child .game b{color:#fff}
.top-badge{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:2px 6px;border-radius:99px;background:rgba(244,201,93,.12);border:1px solid rgba(244,201,93,.24);color:var(--warning);font-size:7px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;vertical-align:middle}
.top-badge.rank-2{background:rgba(207,214,223,.10);border-color:rgba(207,214,223,.24);color:#D8DEE6}
.top-badge.rank-3{background:rgba(184,115,51,.10);border-color:rgba(184,115,51,.24);color:#D79A63}
.movement-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:99px;background:rgba(255,255,255,.035);border:1px solid transparent;animation:movementPop .5s ease both}
.up.movement-badge{background:rgba(55,214,162,.08);border-color:rgba(55,214,162,.16)}
.down.movement-badge{background:rgba(255,117,134,.08);border-color:rgba(255,117,134,.16)}
.new.movement-badge{background:rgba(191,167,255,.09);border-color:rgba(191,167,255,.16)}
.live-value{display:inline-block;min-width:4ch}
.live-pulse{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--positive);box-shadow:0 0 0 0 rgba(55,214,162,.38);animation:livePulse 1.8s infinite;vertical-align:1px}
.moving-section{margin:0 0 18px}
.moving-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px}
.moving-head h2{margin:0;font-family:Manrope,Inter,sans-serif;font-size:17px;letter-spacing:-.025em}
.moving-head p{margin:4px 0 0;color:var(--muted-2);font-size:10px}
.moving-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.moving-card{
  position:relative;min-width:0;
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(145deg,var(--surface),#07111F);
  box-shadow:0 12px 30px rgba(0,0,0,.12);
  transition:.18s ease;
  animation:cardRise .45s ease both
}
.moving-card:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.moving-card,.moving-card:visited,.moving-card:hover,.moving-card:focus{color:var(--text);text-decoration:none}
.moving-card-head{display:flex;align-items:center;gap:10px}
.moving-card img{width:48px;height:48px;border-radius:11px;object-fit:cover;background:#10223A;flex:none}
.moving-info{min-width:0;text-align:left}
.moving-info b,.moving-info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moving-info b{font-size:11px;color:#F7FAFF;font-weight:800}
.moving-info small{margin-top:3px;color:#A9BDD5;font-size:8px}
.moving-rank{margin-left:auto;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:rgba(1,158,251,.08);color:#BBD9F4;font-size:10px;font-weight:850}
.moving-change{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:9px}
.moving-change strong{font-size:10px}
.moving-bar{height:4px;margin-top:8px;border-radius:99px;background:#0D2036;overflow:hidden}
.moving-bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#58C7FF);transform-origin:left center;animation:barGrow .65s ease both}
.moving-label{display:block;color:var(--muted-2);font-size:8px;margin-top:5px}
.load-more-wrap{display:flex;justify-content:center;margin:12px 0 0}
.ranking-body + .load-more-wrap{margin-bottom:24px;padding-bottom:24px}
.load-more-btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:#9FB4CC;
  border-radius:10px;
  padding:9px 18px;
  font-size:10px;
  font-weight:800;
  transition:.18s ease
}
.load-more-btn:hover{color:#fff;border-color:var(--accent);background:var(--surface-2)}
.rank-toggle{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line);
  background:var(--surface);
  color:#AFC2D8;
  border-radius:10px;
  padding:8px 11px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  transition:.18s ease
}
.rank-toggle:hover{color:#fff;border-color:var(--accent)}
.rank-chevron{display:inline-block;font-size:12px;transition:transform .18s ease}
.rank-toggle.collapsed .rank-chevron{transform:rotate(-90deg)}
.ranking-body.collapsed{display:none}
html[data-theme="light"] .load-more-btn,
html[data-theme="light"] .rank-toggle{color:#355774;background:#fff;border-color:rgba(2,35,89,.14)}
html[data-theme="light"] .load-more-btn:hover,
html[data-theme="light"] .rank-toggle:hover{color:#14304D;border-color:var(--accent)}
@keyframes rowRefresh{0%{opacity:.55;transform:translateY(3px)}100%{opacity:1;transform:none}}
@keyframes valuePulse{0%{transform:scale(.96);color:#A9C7E6}45%{transform:scale(1.06);color:#fff}100%{transform:scale(1);color:inherit}}
@keyframes movementPop{0%{opacity:0;transform:scale(.82)}70%{transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
@keyframes imageLift{0%{transform:scale(.97)}55%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(55,214,162,.34)}50%{box-shadow:0 0 0 5px rgba(55,214,162,0)}}
@keyframes cardRise{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:none}}
@keyframes barGrow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
.row img,.cover{
  width:54px;height:54px;border-radius:12px;object-fit:cover;
  background:#10223A;
}
.game{
  border:0;
  background:transparent;
  color:var(--text);
  text-align:left;
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0;
}
.game span{min-width:0}
.game b,.game small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game b{font-size:12px;font-weight:750}
.game small{color:var(--muted-2);font-size:9px;margin-top:4px}
.game-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;border:1px solid rgba(1,158,251,.2);background:rgba(1,158,251,.08);color:#8FCCF3;padding:3px 7px;border-radius:99px;font-size:8px;font-weight:700}
.rank{
  width:30px;height:30px;margin:auto;
  display:grid;place-items:center;
  border-radius:9px;
  color:#7C94AE;
  font-weight:850;font-size:11px;
}
.row:first-child .rank{color:#fff;background:var(--accent);box-shadow:0 7px 16px rgba(1,158,251,.2)}
.players{text-align:right;white-space:nowrap}
.players b{display:block;font-size:12px}
.players small{color:var(--muted-2);font-size:9px}
.movement{text-align:right;font-size:10px;font-weight:850}
.up{color:var(--positive)}
.down{color:var(--negative)}
.new{color:#BFA7FF}
.creator{min-width:0;color:#A5B8CE;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:5px;justify-content:flex-end}
.mini{
  border:1px solid var(--line);
  background:#0D1B2D;
  color:#9FB4CC;
  border-radius:8px;
  padding:7px 9px;
  font-size:9px;
  font-weight:700;
  transition:.16s ease
}
.mini:hover{border-color:var(--accent);color:#fff}
.empty{text-align:center;padding:62px 20px;color:#7188A3;font-size:12px}
.banner{
  padding:11px 13px;margin-bottom:13px;
  border:1px solid var(--line);border-radius:11px;
  background:var(--surface);color:#9FB2C8;font-size:11px
}
.error{color:#FFB7BF;border-color:rgba(255,117,134,.32);background:rgba(93,23,37,.3)}
.side-stack{display:grid;gap:12px}
.side-card{padding:16px}
.side-card h3{margin:0;font-family:Manrope,Inter,sans-serif;font-size:13px;letter-spacing:-.01em}
.side-card p{margin:6px 0 0;color:var(--muted);font-size:10px;line-height:1.6}
.side-top{display:flex;align-items:center;gap:11px}
.side-icon{
  width:38px;height:38px;border-radius:11px;
  display:grid;place-items:center;
  background:rgba(1,158,251,.12);
  color:var(--accent);
  font-size:17px
}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--positive);display:inline-block;box-shadow:0 0 0 4px rgba(55,214,162,.1)}
.data-list{margin:13px 0 0;padding:0;list-style:none;display:grid;gap:9px}
.data-list li{display:flex;justify-content:space-between;gap:10px;color:#ADC0D5;font-size:10px}
.data-list strong{color:#EEF6FF;font-size:10px}
.health{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.health-row{display:flex;align-items:center;gap:9px;color:#B9CCDF;font-size:10px}
.health small{display:block;margin-top:6px;color:var(--muted-2);font-size:9px;line-height:1.5}
.about-link{display:inline-flex;margin-top:10px;color:var(--accent);font-size:10px;font-weight:800}
.detail-head{
  display:flex;gap:17px;align-items:flex-start;
  padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--brand);
}
.detail-head h1{font-family:Manrope,Inter,sans-serif;margin:5px 0 4px;font-size:clamp(28px,5vw,44px);letter-spacing:-.05em}
.detail-head p{margin:0 0 12px;color:#B9CCE3;font-size:11px}
.actions-wide{display:flex;gap:7px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:15px}
.stat span,.stat small{color:var(--muted-2);font-size:9px}
.stat strong{display:block;margin:7px 0 3px;font-family:Manrope,Inter,sans-serif;font-size:20px;letter-spacing:-.03em}
.panel{border:1px solid var(--line);border-radius:15px;background:var(--surface);padding:17px;margin-bottom:12px}
.panel h2{margin:0;font-family:Manrope,Inter,sans-serif;font-size:15px}
.panel p{color:var(--muted);font-size:10px;line-height:1.6}
.chart{height:210px}
.chart svg{width:100%;height:190px}
.line{stroke:var(--accent);stroke-width:3;fill:none}
.rankline{stroke:#86B8FF;stroke-width:3;fill:none}
.gridline{stroke:rgba(176,213,255,.11)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta div{padding:11px;border:1px solid var(--line);border-radius:10px;background:#0A192C}
.meta small{display:block;color:var(--muted-2);font-size:8px}
.meta b{font-size:10px;word-break:break-word}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.info{max-width:900px}
.info h1{font-family:Manrope,Inter,sans-serif;font-size:clamp(30px,5vw,44px);margin:10px 0;letter-spacing:-.05em}
.info p{color:#91A8C3;font-size:12px;line-height:1.8}
.foot{
  margin-top:22px;padding-top:18px;
  border-top:1px solid var(--line);
  color:#647C98;font-size:9px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap
}
.foot button{border:0;background:none;color:#7E97B3;font-size:9px;padding:0}
.foot button:hover{color:var(--accent)}

.rank-card-modal{
  position:fixed;inset:0;z-index:100;
  display:grid;place-items:center;
  padding:18px;
  background:rgba(2,7,14,.88);
  backdrop-filter:blur(12px);
}
.rank-card-dialog{
  width:min(430px,100%);
  max-height:94vh;
  overflow:auto;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  background:#07111F;
  box-shadow:0 28px 90px rgba(0,0,0,.55);
  padding:14px;
}
.rank-card-dialog-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:10px;
}
.rank-card-dialog-title{
  margin:0;font-family:Manrope,Inter,sans-serif;font-size:14px;
}
.rank-card-dialog-sub{
  margin:3px 0 0;color:#7F97B2;font-size:9px;
}

<body>
<header class="top"><button class="brand" id="homeBtn"><img class="mark" src="/assets/bobaks-logo.png" alt=""> <span>Bobaks <span class="brand-accent">Ranking</span></span></button><nav class="nav"><button id="rankNav" class="active">Rankings</button><button id="savedNav">Saved <span id="savedCount"></span></button><button id="compareNav" hidden>Compare</button><button id="themeNav" aria-label="Switch theme" title="Switch theme">☾ Dark</button></nav></header>
<main id="app" class="wrap"></main>
<script>
'use strict';
const API='https://bobaks-ranking-api-service.ryan-oledan0.workers.dev';
const periods=[['live','Live'],['week','This Week'],['month','This Month'],['year','This Year']];
const state={view:'home',period:'live',theme:'dark',rankingExpanded:true,rankingLimit:15,movingLimit:2,games:[],saved:[],compare:[],selected:null,query:'',results:[],loading:false,error:'',next:null,timer:null,searchRequest:0};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(Number(v)||0);
const fmtTime=v=>new Date(v).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
const fmtDateTime=v=>new Date(v).toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
async function api(path){const r=await fetch(API+path);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function loadTheme(){try{const saved=localStorage.getItem('bobaks.theme');state.theme=saved==='light'?'light':'dark'}catch{state.theme='dark'}document.documentElement.setAttribute('data-theme',state.theme)}
function setTheme(theme){state.theme=theme==='light'?'light':'dark';document.documentElement.setAttribute('data-theme',state.theme);try{localStorage.setItem('bobaks.theme',state.theme)}catch{};nav()}
function loadSaved(){try{const v=JSON.parse(localStorage.getItem('bobaks.watchlist')||'[]');if(Array.isArray(v))state.saved=[...new Set(v.map(String))].slice(0,25)}catch{state.saved=[]}}
function saveSaved(){try{localStorage.setItem('bobaks.watchlist',JSON.stringify(state.saved))}catch{}}
function nav(){ $('rankNav').classList.toggle('active',state.view==='home');$('savedNav').classList.toggle('active',state.view==='saved');$('savedCount').textContent=state.saved.length?'('+state.saved.length+')':'';$('compareNav').hidden=state.compare.length===0;$('compareNav').textContent='Compare ('+state.compare.length+')';const themeBtn=$('themeNav');if(themeBtn){themeBtn.textContent=state.theme==='dark'?'☾ Dark':'☀ Light';themeBtn.title=state.theme==='dark'?'Switch to light mode':'Switch to dark mode';themeBtn.setAttribute('aria-label',themeBtn.title)}}
function fallbackNext(){const n=Date.now(),step=600000;return new Date((Math.floor(n/step)+1)*step+15000).toISOString()}
function schedule(){if(state.timer)clearTimeout(state.timer);if(state.next)state.timer=setTimeout(loadRankings,Math.max(1000,new Date(state.next).getTime()-Date.now()))}
function movement(g){if(g.previousRank==null)return '<span class="new movement-badge">NEW</span>';const d=Number(g.rankChange||0);if(d>0)return '<span class="up movement-badge">▲ '+d+' rank'+(d===1?'':'s')+'</span>';if(d<0)return '<span class="down movement-badge">▼ '+Math.abs(d)+' rank'+(Math.abs(d)===1?'':'s')+'</span>';return '<span class="movement-badge">• No change</span>'}
function icon(url){return url?'<img src="'+esc(url)+'" alt="">':'<div class="cover"></div>'}
async function loadRankings(){
  state.loading=true;state.error='';render();
  try{
    const p=await api('/api/rankings?period='+encodeURIComponent(state.period));
    const previous=new Map(state.games.map(g=>[g.gameId,g]));
    state.games=(p.data||[]).map(x=>{
      const id=String(x.gameId),old=previous.get(id),playing=Number(x.score||0);
      return {rank:Number(x.rank),gameId:id,name:x.game?.name||'Unknown game',creator:x.game?.creatorName||'Unknown creator',icon:x.game?.iconUrl||'',playing,previousPlaying:old?.playing??null,changed:old!=null&&playing!==old.playing,previousRank:x.previousRank==null?null:Number(x.previousRank),rankChange:x.rankChange==null?null:Number(x.rankChange),calculatedAt:x.calculatedAt||null,placeId:Number(x.game?.placeId||0)}
    });
    state.next=p.nextCollectionAt||fallbackNext()
  }catch(e){
    state.games=[];state.next=null;state.error='Ranking data could not be loaded right now. Try again in a moment.'
  }finally{state.loading=false;render();schedule()}
}
function renderSearchResults(){
  const el=document.querySelector('.results');
  if(!el)return;
  el.innerHTML=state.results.map(g=>'<button data-search-game="'+g.id+'"><b>'+esc(g.name)+'</b><br><small>'+esc(g.creator)+'</small></button>').join('');
  document.querySelectorAll('[data-search-game]').forEach(b=>b.onclick=()=>{state.results=[];openGame(b.dataset.searchGame)});
}
async function search(q){
  const query=q.trim();
  const requestId=++state.searchRequest;
  if(query.length<2){state.results=[];renderSearchResults();return}
  try{
    const p=await api('/api/search?q='+encodeURIComponent(query));
    if(requestId!==state.searchRequest || query!==state.query.trim())return;
    state.results=(p.data||[]).map(x=>({id:String(x.id),name:x.name,creator:x.creatorName||'Unknown creator'}));
    renderSearchResults();
  }catch{
    if(requestId!==state.searchRequest)return;
    state.results=[];
    renderSearchResults();
  }
}
function footer(){return '<footer class="foot"><div>Bobaks Ranking · Independent fan-made analytics site · Not affiliated with Roblox Corporation.</div><div><button data-info="methodology">How Rankings Work</button> <button data-info="privacy">Privacy</button> <button data-info="terms">Terms</button> <button data-info="sources">Data Sources</button></div></footer>'}
function home(){
  const tabs=periods.map(p=>'<button class="'+(state.period===p[0]?'active':'')+'" data-period="'+p[0]+'">'+p[1]+'</button>').join('');
  let rows='';
  if(state.loading&&!state.games.length)rows='<div class="empty">Loading live ranking data...</div>';
  else if(!state.games.length)rows='<div class="empty">No ranking data is available right now.</div>';
  else {
    const visibleGames=state.period==='live'?state.games.slice(0,state.rankingLimit):state.games;
    rows=visibleGames.map((g,i)=>{
      const valueAnim=g.changed&&g.previousPlaying!=null?' data-from="'+g.previousPlaying+'" data-to="'+g.playing+'"':'';
      return '<div class="row '+(g.changed?'value-changed ':'')+(i===0?'top-ranked':'')+'"><span class="rank">#'+g.rank+'</span><button class="game" data-game="'+g.gameId+'">'+icon(g.icon)+'<span><b>'+esc(g.name)+(g.rank===1?'<span class="top-badge">★ #1</span>':g.rank===2?'<span class="top-badge rank-2">★ #2</span>':g.rank===3?'<span class="top-badge rank-3">★ #3</span>':'')+'</b><small>'+esc(g.creator)+'</small><span class="game-tags"><span class="tag">'+(state.period==='live'?'<span class="live-pulse"></span>Live players':periods.find(p=>p[0]===state.period)[1])+'</span></span></span></button><span class="creator">'+esc(g.creator)+'</span><span class="players"><b class="live-value"'+valueAnim+'>'+fmt(g.playing)+'</b><small>'+(state.period==='live'?'players':'avg players')+'</small></span><span class="movement">'+movement(g)+'</span><span class="actions"><button class="mini" data-save="'+g.gameId+'">'+(state.saved.includes(g.gameId)?'Saved':'Save')+'</button><button class="mini" data-compare="'+g.gameId+'">'+(state.compare.includes(g.gameId)?'Compared':'Compare')+'</button></span></div>'
    }).join('');
  }

function animateLiveValues(){

    const from=Number(el.dataset.from),to=Number(el.dataset.to);
    if(!Number.isFinite(from)||!Number.isFinite(to)||from===to)return;
    const start=performance.now(),duration=560;
    const ease=t=>1-Math.pow(1-t,3);
    const tick=now=>{
      const t=Math.min(1,(now-start)/duration);
      el.textContent=fmt(Math.round(from+(to-from)*ease(t)));
      if(t<1)requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });

function wrapLines(ctx,text,maxWidth,maxLines=3){
  const words=String(text||'').split(/\s+/);
  const lines=[];let line='';
  for(const word of words){
    const next=line?line+' '+word:word;
    if(ctx.measureText(next).width<=maxWidth){line=next;continue}
    if(line)lines.push(line);
    line=word;
    if(lines.length===maxLines-1)break;
  }
  if(lines.length<maxLines&&line)lines.push(line);
  if(lines.length===maxLines&&words.join(' ').length>lines.join(' ').length){
    let last=lines[maxLines-1];
    while(ctx.measureText(last+'…').width>maxWidth&&last.length>1)last=last.slice(0,-1);
    lines[maxLines-1]=last+'…';
  }
  return lines;
}

    ctx.restore();
  }

  function drawRandomSymbols(ctx,time,preview){
    if(!preview)return;

    const slotCount=rank===1?11:rank&&rank<=3?9:8;
    const step=500;
    const t=Math.max(0,time||0);
    const cycle=Math.floor(t/step);
    const phase=(t%step)/step;
    const fadeOut=Math.max(0,1-phase/.5);
    const fadeIn=Math.min(1,phase/.5);
    const types=['block','circle','triangle','square','gamepad'];

    function sceneSymbol(slot,scene){
      const base=scene*997+slot*113+rank*31;
      return {
        type:types[Math.floor(seededRandom(base+5)*types.length)%types.length],
        x:90+seededRandom(base+1)*(W-180),
        y:150+seededRandom(base+2)*(H-300),
        size:22+seededRandom(base+3)*36,
        rotation:(seededRandom(base+4)-.5)*Math.PI
      };
    }

    for(let slot=0;slot<slotCount;slot++){
      const oldSymbol=sceneSymbol(slot,cycle);
      const newSymbol=sceneSymbol(slot,cycle+1);
      const baseOpacity=.045;

      drawSymbol(
        ctx,oldSymbol.type,oldSymbol.x,oldSymbol.y,oldSymbol.size,oldSymbol.rotation,
        baseOpacity*fadeOut,hexToRgba(tier.accent,1),hexToRgba(tier.accent2,.95)
      );
      drawSymbol(
        ctx,newSymbol.type,newSymbol.x,newSymbol.y,newSymbol.size,newSymbol.rotation,
        baseOpacity*fadeIn,hexToRgba(tier.accent,1),hexToRgba(tier.accent2,.95)
      );
    }
  }

  function drawFoil(ctx,time,preview=true){
    drawRandomSymbols(ctx,time,preview);

    if(preview){
      const count=rank===1?26:rank&&rank<=3?18:12;
      for(let i=0;i<count;i++){
        const seed=i*1337+rank*97;
        const x=75+(Math.abs(Math.sin(seed))*1050);
        const y=120+(Math.abs(Math.cos(seed*.71))*1310);
        const pulse=.7+.3*Math.sin((time||0)/900+i);
        drawSpark(ctx,x,y,(rank===1?7:5)*pulse,.5*pulse,tier.accent2);
      }
    }
  }

function drawFrame(time=0,preview=true){
    ctx.clearRect(0,0,W,H);

    const bg=ctx.createLinearGradient(0,0,W,H);
    if(tier.family==='gold'){
      bg.addColorStop(0,'#120D02');bg.addColorStop(.32,'#3B2608');bg.addColorStop(.52,'#8D6212');bg.addColorStop(.76,'#2B1A05');bg.addColorStop(1,'#090602');
    }else if(tier.family==='purple'){
      bg.addColorStop(0,'#0D0718');bg.addColorStop(.32,'#281045');bg.addColorStop(.55,'#5C2E97');bg.addColorStop(.76,'#22103D');bg.addColorStop(1,'#07030E');
    }else if(tier.family==='blue'){
      bg.addColorStop(0,'#02131C');bg.addColorStop(.34,'#063D59');bg.addColorStop(.55,'#087EA4');bg.addColorStop(.78,'#063349');bg.addColorStop(1,'#011018');
    }else if(tier.family==='green'){
      bg.addColorStop(0,'#04130B');bg.addColorStop(.34,'#0C4B2A');bg.addColorStop(.55,'#1E8E52');bg.addColorStop(.8,'#0A3A22');bg.addColorStop(1,'#020C07');
    }else if(tier.family==='white'){
      bg.addColorStop(0,'#0F1318');bg.addColorStop(.32,'#48535E');bg.addColorStop(.52,'#AEB7C0');bg.addColorStop(.76,'#3B454F');bg.addColorStop(1,'#0A0D11');
    }else{
      bg.addColorStop(0,'#08101A');bg.addColorStop(.45,'#172636');bg.addColorStop(1,'#05090E');
    }
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    const glow=ctx.createRadialGradient(W*.5,260,30,W*.5,260,780);
    glow.addColorStop(0,hexToRgba(tier.accent,.26*tier.glow));
    glow.addColorStop(.4,hexToRgba(tier.accent,.095*tier.glow));
    glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,900);

    for(let i=0;i<28;i++){
      const x=(i*157+73)%W,y=(i*89+140)%H;
      ctx.fillStyle=hexToRgba(tier.accent2,.035+(i%3)*.01);
      ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,Math.PI*2);ctx.fill();
    }

    roundRect(ctx,30,30,W-60,H-60,48);
    ctx.fillStyle='rgba(3,8,15,.32)';ctx.fill();
    ctx.strokeStyle=hexToRgba(tier.accent,rank===1?.86:.62);
    ctx.lineWidth=rank===1?10:7;ctx.stroke();

    roundRect(ctx,50,50,W-100,H-100,40);
    ctx.strokeStyle=hexToRgba(tier.accent2,rank===1?.62:.38);
    ctx.lineWidth=3;ctx.stroke();

    const inner=ctx.createLinearGradient(0,0,W,0);
    inner.addColorStop(0,hexToRgba(tier.accent,.03));
    inner.addColorStop(.5,hexToRgba(tier.accent2,.13));
    inner.addColorStop(1,hexToRgba(tier.accent,.03));
    ctx.fillStyle=inner;ctx.fillRect(62,62,W-124,18);ctx.fillRect(62,H-80,W-124,18);

    if(rank===1){
      for(let i=0;i<18;i++){
        const a=(i/18)*Math.PI*2;
        const rr=470+(i%3)*38;
        drawSpark(ctx,W/2+Math.cos(a)*rr,280+Math.sin(a)*rr,7+(i%3)*2,.62,tier.accent2);
      }
    }

    if(logo)ctx.drawImage(logo,72,72,58,58);
    ctx.textAlign='left';
    ctx.fillStyle='#F7FAFF';ctx.font='800 30px Inter,system-ui,sans-serif';
    ctx.fillText('BOBAKS RANKING',146,110);
    ctx.fillStyle=tier.accent;ctx.font='900 18px Inter,system-ui,sans-serif';
    ctx.fillText(tier.name,146,140);

    ctx.textAlign='center';
    ctx.fillStyle=tier.accent;
    ctx.font=rank===1?'900 158px Inter,system-ui,sans-serif':rank&&rank<=3?'900 142px Inter,system-ui,sans-serif':'900 128px Inter,system-ui,sans-serif';
    ctx.shadowColor=hexToRgba(tier.accent,.68);ctx.shadowBlur=rank===1?46:30;
    ctx.fillText(rank?'#'+rank:'UNRANKED',W/2,315);
    ctx.shadowBlur=0;
    ctx.fillStyle=tier.accent2;ctx.font='900 24px Inter,system-ui,sans-serif';
    ctx.fillText(tier.badge,W/2,360);

    const artX=92,artY=405,artW=W-184,artH=530;
    roundRect(ctx,artX,artY,artW,artH,30);
    ctx.save();ctx.clip();
    if(gameImage){
      const s=Math.max(artW/gameImage.width,artH/gameImage.height),dw=gameImage.width*s,dh=gameImage.height*s;
      const dx=artX+(artW-dw)/2,dy=artY+(artH-dh)/2;
      ctx.globalAlpha=.88;ctx.drawImage(gameImage,dx,dy,dw,dh);ctx.globalAlpha=1;
      const fade=ctx.createLinearGradient(0,artY,0,artY+artH);
      fade.addColorStop(0,'rgba(2,7,17,.03)');fade.addColorStop(.62,'rgba(2,7,17,.08)');fade.addColorStop(1,'rgba(2,7,17,.83)');
      ctx.fillStyle=fade;ctx.fillRect(artX,artY,artW,artH);
    }else{
      ctx.fillStyle='#10223A';ctx.fillRect(artX,artY,artW,artH);
      ctx.fillStyle=tier.accent;ctx.font='900 160px Inter,system-ui,sans-serif';
      ctx.fillText(String(g.name||'?').charAt(0).toUpperCase(),W/2,artY+330);
    }

    const artGlow=ctx.createRadialGradient(W*.5,artY+210,30,W*.5,artY+210,520);
    artGlow.addColorStop(0,hexToRgba(tier.accent,.20*tier.glow));
    artGlow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=artGlow;ctx.fillRect(artX,artY,artW,artH);
    ctx.restore();

    roundRect(ctx,artX,artY,artW,artH,30);
    ctx.strokeStyle=hexToRgba(tier.accent,.78);ctx.lineWidth=5;ctx.stroke();
    roundRect(ctx,artX+8,artY+8,artW-16,artH-16,24);
    ctx.strokeStyle=hexToRgba(tier.accent2,.28);ctx.lineWidth=2;ctx.stroke();

    drawFoil(ctx,time,preview);

    ctx.textAlign='left';
    ctx.fillStyle='#fff';
    ctx.font=rank===1?'900 58px Inter,system-ui,sans-serif':'900 52px Inter,system-ui,sans-serif';
    const titleLines=wrapLines(ctx,g.name||'Unknown game',1000,2);
    titleLines.forEach((line,i)=>ctx.fillText(line,100,1010+i*64));

    ctx.fillStyle='#B8CBE0';ctx.font='700 22px Inter,system-ui,sans-serif';
    ctx.fillText('by '+String(g.creatorName||g.creator||'Unknown creator').slice(0,54),100,1148);

    const statY=1210;
    const boxes=[
      {label:'CURRENT PLAYERS',value:fmt(current)},
      {label:'RECORDED PEAK',value:fmt(peak)}
    ];
    boxes.forEach((b,i)=>{
      const x=100+i*500;
      roundRect(ctx,x,statY,450,112,18);
      ctx.fillStyle=hexToRgba(tier.accent,.07);ctx.fill();
      ctx.strokeStyle=hexToRgba(tier.accent2,.25);ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#7890A8';ctx.font='800 16px Inter,system-ui,sans-serif';ctx.fillText(b.label,x+24,statY+32);
      ctx.fillStyle='#fff';ctx.font='900 38px Inter,system-ui,sans-serif';ctx.fillText(b.value,x+24,statY+78);
    });

    ctx.fillStyle=rankChange==null?tier.accent2:rankChange>0?'#37D6A2':rankChange<0?'#FF7586':tier.accent2;
    ctx.font='900 25px Inter,system-ui,sans-serif';
    const movement=rankChange==null?(previousRank==null?'NEW ENTRY':'RANK'):(rankChange>0?'▲ '+rankChange+' RANK'+(rankChange===1?'':'S')+' UP':rankChange<0?'▼ '+Math.abs(rankChange)+' RANK'+(Math.abs(rankChange)===1?'':'S')+' DOWN':'NO RANK CHANGE');
    ctx.fillText(movement,100,1384);

    ctx.fillStyle='#EEF6FF';ctx.font='800 22px Inter,system-ui,sans-serif';
    const msgLines=wrapLines(ctx,cardMessage({...g,isNewEntry:previousRank==null},rank),980,2);
    msgLines.forEach((line,i)=>ctx.fillText(line,100,1423+i*30));

    ctx.fillStyle='#7A91A8';ctx.font='700 17px Inter,system-ui,sans-serif';
    ctx.fillText('Track this game and discover more rankings at',100,1512);
    ctx.fillStyle=tier.accent2;ctx.font='900 19px Inter,system-ui,sans-serif';
    ctx.fillText(location.host,100,1544);
    ctx.textAlign='right';ctx.fillStyle='#6C849D';ctx.font='700 15px Inter,system-ui,sans-serif';
    ctx.fillText('BOBAKS · GAME RANK CARD',1080,1544);
    ctx.textAlign='left';
  }

  drawFrame(performance.now(),true);
  const gameLink=location.origin;
  const shareMessage=cardMessage({...g,isNewEntry:previousRank==null},rank);
  const shareText=[
    String(g.name||'Unknown game')+' · '+(rank?'#'+rank:'Unranked'),
    '',
    shareMessage,
    '',
    'Visit Bobaks Ranking:',
    gameLink
  ].join('\n');

  return {
    canvas,
    rank,
    tier,
    rankChange,
    text:shareText,
    gameLink,
    drawFrame,
    startAnimation(){
      let raf;
      const tick=now=>{
        drawFrame(now,true);
        raf=requestAnimationFrame(tick);
      };
      raf=requestAnimationFrame(tick);
      return ()=>cancelAnimationFrame(raf);
    }
  };
}

function closeRankCardModal(){
  const modal=document.querySelector('.rank-card-modal');
  if(modal)modal.remove();
}

async function share(id){
  let modal;
  try{
    const r=await api('/api/games/'+encodeURIComponent(id));
    const g={...(r.data||{}),gameId:String(id)};
    if(!g.name)throw new Error('Game not found');

    modal=document.createElement('div');
    modal.className='rank-card-modal';
    modal.innerHTML='<div class="rank-card-dialog" role="dialog" aria-modal="true" aria-label="Bobaks Game Rank Card"><div class="rank-card-dialog-head"><div><h2 class="rank-card-dialog-title">Your Bobaks Game Rank Card</h2><p class="rank-card-dialog-sub">Data-driven from the current Bobaks ranking</p></div><button class="rank-card-close" aria-label="Close">×</button></div><div class="rank-card-canvas-wrap"><div class="rank-card-generating"><span class="spinner"></span><span>Generating your card…</span></div></div></div>';
    document.body.appendChild(modal);

    const result=await generateRankCard(g);
    const wrap=modal.querySelector('.rank-card-canvas-wrap');
    wrap.innerHTML='';
    result.canvas.className='rank-card-canvas';
    wrap.appendChild(result.canvas);

    let stopAnimation=result.startAnimation();
    const stop=()=>{if(stopAnimation){stopAnimation();stopAnimation=null}};
    const restart=()=>{if(!stopAnimation)stopAnimation=result.startAnimation()};

    const filename='bobaks-'+String(g.name||'game').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()+'-rank-card.png';
    const getBlob=async()=>{
      const wasAnimating=!!stopAnimation;
      if(wasAnimating)stop();
      result.drawFrame(performance.now(),false);
      const b=await new Promise((resolve,reject)=>result.canvas.toBlob(x=>x?resolve(x):reject(new Error('PNG export failed')),'image/png'));
      if(wasAnimating)restart();
      return b;
    };
    const copyText=async textValue=>{
      if(!navigator.clipboard)throw new Error('Clipboard unavailable');
      await navigator.clipboard.writeText(textValue);
    };
    const downloadBlob=async b=>{
      const url=URL.createObjectURL(b);
      const a=document.createElement('a');
      a.href=url;a.download=filename;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
    };
    const setStatus=message=>{
      const el=modal.querySelector('.rank-card-share-status');
      if(el){el.textContent=message;el.classList.add('show')}
    };

    const caption=result.text;
    const link=result.gameLink;

    modal.querySelector('.rank-card-close').onclick=()=>{stop();closeRankCardModal()};
    modal.addEventListener('click',e=>{if(e.target===modal){stop();closeRankCardModal()}});

    const actions=document.createElement('div');
    actions.className='rank-card-actions';
    actions.innerHTML='<button class="btn primary" data-download>Download PNG</button><button class="btn" data-share>Share Card</button>';
    wrap.parentElement.appendChild(actions);

    const toolsBox=document.createElement('div');
    toolsBox.className='rank-card-tools';
    toolsBox.innerHTML='<button class="btn" data-copy-caption>Copy caption</button><button class="btn" data-copy-link>Copy link</button>';
    wrap.parentElement.appendChild(toolsBox);

    const label=document.createElement('div');
    label.className='rank-card-tools-label';
    label.textContent='Social share helpers';
    wrap.parentElement.appendChild(label);

    const platforms=document.createElement('div');
    platforms.className='rank-card-platform-grid';
    platforms.innerHTML=[
      ['Messenger','💬','messenger'],
      ['Instagram','◎','instagram'],
      ['TikTok','♪','tiktok'],
      ['WhatsApp','◌','whatsapp'],
      ['Facebook','f','facebook'],
      ['X','𝕏','x'],
      ['Discord','☯','discord'],
      ['More apps','↗','native']
    ].map(([name,icon,key])=>'<button class="btn" data-platform="'+key+'"><span class="platform-icon">'+icon+'</span><strong>'+name+'</strong><small>Prepare share</small></button>').join('');
    wrap.parentElement.appendChild(platforms);

    const note=document.createElement('div');
    note.className='rank-card-note';
    note.textContent='Some apps accept an image and text together, while others may keep only the image. Bobaks prepares the caption and image separately so the user can post them together.';
    wrap.parentElement.appendChild(note);

    const status=document.createElement('div');
    status.className='rank-card-share-status';
    wrap.parentElement.appendChild(status);

    modal.querySelector('[data-download]').onclick=async()=>{
      try{
        const b=await getBlob();
        await downloadBlob(b);
        setStatus('PNG downloaded. Your caption is ready to copy for platforms that need it separately.');
      }catch{setStatus('The card could not be downloaded. Try Copy caption or Share Card.')}
    };

    modal.querySelector('[data-share]').onclick=async()=>{
      try{
        const b=await getBlob();
        const file=new File([b],filename,{type:'image/png'});
        const canShareFiles=!!(navigator.canShare&&navigator.canShare({files:[file]}));

        if(navigator.share&&canShareFiles){
          await navigator.share({
            title:String(g.name||'Bobaks Game')+' · '+(result.rank?'#'+result.rank:'Unranked')+' · Bobaks Ranking',
            text:caption,
            url:link,
            files:[file]
          });
          setStatus('Share sheet used. If the selected app drops the caption, use Copy caption and paste it after sending the image.');
        }else if(navigator.share){
          await navigator.share({
            title:String(g.name||'Bobaks Game')+' · '+(result.rank?'#'+result.rank:'Unranked')+' · Bobaks Ranking',
            text:caption,
            url:link
          });
          setStatus('Text and link shared. Download PNG separately when the app requires the image.');
        }else{
          await copyText(caption);
          await downloadBlob(b);
          setStatus('Caption copied + PNG downloaded. You can post both on any platform.');
        }
      }catch(error){
        if(error?.name==='AbortError')return;
        setStatus('Sharing is unavailable here. Use Download PNG + Copy caption instead.');
      }
    };

    modal.querySelector('[data-copy-caption]').onclick=async()=>{
      try{
        await copyText(caption);
        setStatus('Caption copied. Paste it into Messenger, Instagram, TikTok, Facebook, WhatsApp, X, Discord, or another app.');
      }catch{
        setStatus('Clipboard access is unavailable. Use the device share action instead.');
      }
    };

    modal.querySelector('[data-copy-link]').onclick=async()=>{
      try{
        await copyText(link);
        setStatus('Bobaks link copied. Paste it below your caption on any platform.');
      }catch{setStatus('Clipboard access is unavailable.')}
    };

    const preparePlatform=async key=>{
      const b=await getBlob();
      const open=url=>window.open(url,'_blank','noopener,noreferrer');

      if(key==='messenger'){
        await copyText(caption);
        if(navigator.share){
          const file=new File([b],filename,{type:'image/png'});
          const canShareFiles=!!(navigator.canShare&&navigator.canShare({files:[file]}));
          if(canShareFiles){
            try{
              await navigator.share({
                title:String(g.name||'Bobaks Game')+' · '+(result.rank?'#'+result.rank:'Unranked'),
                text:caption,
                url:link,
                files:[file]
              });
              setStatus('Caption copied. Choose Messenger in the share sheet, send the card, then paste the copied caption if Messenger sends only the image.');
              return;
            }catch(error){
              if(error?.name==='AbortError')return;
            }
          }
        }
        await downloadBlob(b);
        setStatus('Caption copied + PNG downloaded. Open Messenger, attach the image, then paste the copied caption.');
        return;
      }

      if(key==='whatsapp'){
        await downloadBlob(b);
        open('https://wa.me/?text='+encodeURIComponent(caption));
        setStatus('WhatsApp opened with the caption and Bobaks link. Attach the downloaded PNG if needed.');
        return;
      }

      if(key==='x'){
        await downloadBlob(b);
        open('https://twitter.com/intent/tweet?text='+encodeURIComponent(caption)+'&url='+encodeURIComponent(link));
        setStatus('X opened with the caption and Bobaks link. Add the downloaded PNG if you want the image attached.');
        return;
      }

      if(key==='facebook'){
        await copyText(caption);
        await downloadBlob(b);
        open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(link));
        setStatus('Facebook opened for the Bobaks link. Caption copied + PNG downloaded for your post.');
        return;
      }

      if(key==='instagram'){
        await copyText(caption);
        await downloadBlob(b);
        open('https://www.instagram.com/');
        setStatus('Instagram opened. Caption copied + PNG downloaded. Create a post and paste the caption.');
        return;
      }

      if(key==='tiktok'){
        await copyText(caption);
        await downloadBlob(b);
        open('https://www.tiktok.com/');
        setStatus('TikTok opened. Caption copied + PNG downloaded. Create a photo post and paste the caption.');
        return;
      }

      if(key==='discord'){
        await copyText(caption);
        await downloadBlob(b);
        open('https://discord.com/app');
        setStatus('Discord opened. Caption copied + PNG downloaded. Attach the card and paste the caption.');
        return;
      }

      if(key==='native'){
        const file=new File([b],filename,{type:'image/png'});
        if(navigator.share){
          try{
            if(navigator.canShare&&navigator.canShare({files:[file]})){
              await navigator.share({
                title:String(g.name||'Bobaks Game')+' · Bobaks Ranking',
                text:caption,
                url:link,
                files:[file]
              });
            }else{
              await navigator.share({
                title:String(g.name||'Bobaks Game')+' · Bobaks Ranking',
                text:caption,
                url:link
              });
            }
            setStatus('Native share sheet opened. Choose any supported app.');
            return;
          }catch(error){
            if(error?.name==='AbortError')return;
          }
        }
        await copyText(caption);
        await downloadBlob(b);
        setStatus('Caption copied + PNG downloaded. Use any app you like.');
      }
    };

    platforms.querySelectorAll('[data-platform]').forEach(btn=>{
      btn.onclick=async()=>{
        try{await preparePlatform(btn.dataset.platform)}
        catch{setStatus('Could not prepare this platform. Use Download PNG + Copy caption instead.')}
      };
    });
  }catch{
    if(modal)modal.remove();
    state.error='The Bobaks rank card could not be generated right now.';
    render();
  }
}

$('homeBtn').onclick=()=>{state.view='home';render();loadRankings()};$('rankNav').onclick=()=>{state.view='home';render();loadRankings()};$('savedNav').onclick=()=>{state.view='saved';render()};$('compareNav').onclick=()=>{state.view='compare';render()};$('themeNav').onclick=()=>setTheme(state.theme==='dark'?'light':'dark');
loadTheme();loadSaved();render();loadRankings();
