<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bobaks Ranking | Live Rankings & Historical Trends</title>
<meta name="description" content="Live rankings and historical trends for Roblox experiences.">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/bobaks-logo.png">
<link rel="apple-touch-icon" href="/assets/bobaks-logo.png">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eef2f7;background:#07090d}*{box-sizing:border-box}body{margin:0;background:#07090d}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.top{height:62px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #20242b;background:#090b10}.brand{border:0;background:none;color:#fff;font-weight:850;letter-spacing:.1em;display:flex;align-items:center;gap:9px}.mark{width:30px;height:30px;border-radius:50%;display:block;object-fit:cover;flex:none}.nav{display:flex;gap:5px}.nav button,.btn{border:1px solid #242a33;background:#10151c;color:#c7cfd8;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:800}.nav button.active{color:#fff;background:#20262f}.wrap{width:min(1180px,calc(100% - 20px));margin:auto;padding:28px 0}.hero{padding:10px 0 25px}.eyebrow{color:#8d97a5;font-size:10px;font-weight:850;letter-spacing:.16em}.hero h1{font-size:clamp(42px,8vw,72px);line-height:.9;margin:12px 0 15px;letter-spacing:-.05em}.hero em{color:#ff4141;font-style:normal}.hero p{color:#8d97a5;font-size:14px}.controls{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}.tabs{display:flex;gap:4px;padding:4px;border:1px solid #20252d;border-radius:11px;background:#0d1117;overflow:auto}.tabs button{border:0;background:none;color:#7e8997;padding:8px 12px;border-radius:7px;font-size:11px;font-weight:800;white-space:nowrap}.tabs button.active{background:#20262f;color:#fff}.search{position:relative;margin-bottom:18px}.search input{width:100%;height:46px;border:1px solid #20252d;border-radius:11px;background:#0d1117;color:#fff;padding:0 13px;outline:none}.results{position:absolute;left:0;right:0;top:51px;z-index:4;background:#10151c;border:1px solid #252c36;border-radius:11px;overflow:hidden}.results:empty{display:none}.results button{width:100%;border:0;background:none;color:#fff;text-align:left;padding:10px 12px}.results button:hover{background:#1a2028}.banner{padding:11px 13px;margin-bottom:13px;border:1px solid #252c36;border-radius:10px;background:#11161d;color:#9aa4b1;font-size:11px}.error{color:#ff9d9d;border-color:#572a2a}.listhead{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:10px}.listhead h2{margin:0;font-size:18px}.listhead p{margin:4px 0;color:#737e8c;font-size:10px}.updated{color:#737e8c;font-size:9px}.rows{border-top:1px solid #1c222a}.row{display:grid;grid-template-columns:36px 54px minmax(0,1fr) 90px 80px;gap:9px;align-items:center;min-height:72px;border-bottom:1px solid #1c222a}.row img,.cover{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#171d25}.game{border:0;background:none;color:#eef2f7;text-align:left;display:flex;gap:10px;align-items:center;min-width:0}.game span{min-width:0}.game b,.game small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.game b{font-size:12px}.game small{color:#707b89;font-size:9px;margin-top:3px}.rank{color:#697381;text-align:center;font-weight:850;font-size:11px}.players{text-align:right;white-space:nowrap}.players b{display:block;font-size:12px}.players small{color:#707b89;font-size:9px}.movement{text-align:right;font-size:10px;font-weight:850}.up{color:#62d89d}.down{color:#ff7f7f}.new{color:#c2a7ff}.actions{display:flex;gap:5px;justify-content:flex-end}.mini{border:1px solid #252c36;background:#10151c;color:#9ba5b3;border-radius:7px;padding:6px 7px;font-size:9px}.empty{text-align:center;padding:50px;color:#697482}.detail-head{display:flex;gap:15px;align-items:flex-start}.detail-head h1{margin:4px 0;font-size:clamp(28px,6vw,48px)}.detail-head p{margin:0 0 10px;color:#7d8794;font-size:11px}.actions-wide{display:flex;gap:6px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.stat{border:1px solid #1c222a;border-radius:12px;background:#0d1117;padding:13px}.stat span,.stat small{color:#707b89;font-size:9px}.stat strong{display:block;margin:7px 0 3px;font-size:20px}.panel{border:1px solid #1c222a;border-radius:12px;background:#0d1117;padding:14px;margin-bottom:12px}.panel h2{margin:0;font-size:16px}.panel p{color:#737e8c;font-size:10px}.chart{height:210px}.chart svg{width:100%;height:190px}.line{stroke:#ff4b4b;stroke-width:3;fill:none}.rankline{stroke:#93a2ff;stroke-width:3;fill:none}.gridline{stroke:#202630}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta div{padding:10px;border:1px solid #202731;border-radius:9px}.meta small{display:block;color:#687381;font-size:8px}.meta b{font-size:10px;word-break:break-word}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{max-width:900px}.info h1{font-size:42px;margin:10px 0}.info p{color:#858f9d;font-size:12px;line-height:1.7}.foot{margin-top:22px;padding-top:18px;border-top:1px solid #171c23;color:#697482;font-size:9px;display:flex;justify-content:space-between;gap:12px}.foot button{border:0;background:none;color:#7d8794;font-size:9px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:30px 50px minmax(0,1fr) 75px}.actions{grid-column:3/5;justify-content:flex-start}.row{padding:8px 0}}@media(max-width:560px){.top{padding:0 10px}.brand{font-size:10px}.nav button{padding:7px}.wrap{padding-top:22px}.controls{align-items:stretch;flex-direction:column}.tabs{width:100%}.tabs button{flex:1}.listhead{align-items:flex-start;flex-direction:column}.row{grid-template-columns:24px 1fr 78px}.row img,.cover{width:50px;height:50px}.game{grid-column:2}.players{grid-column:3}.movement{grid-column:3;grid-row:2}.actions{grid-column:2/4}.detail-head h1{font-size:27px}.stats,.meta,.compare{grid-template-columns:1fr 1fr}.foot{display:block}}
</style>
</head>
<body>
<header class="top"><button class="brand" id="homeBtn"><img class="mark" src="/assets/bobaks-logo.png" alt="">BOBAKS RANKING</button><nav class="nav"><button id="rankNav" class="active">Rankings</button><button id="savedNav">Saved <span id="savedCount"></span></button><button id="compareNav" hidden>Compare</button></nav></header>
<main id="app" class="wrap"></main>
<script>
'use strict';
const API='https://bobaks-ranking-api-service.ryan-oledan0.workers.dev';
const periods=[['live','Live'],['week','This Week'],['month','This Month'],['year','This Year']];
const state={view:'home',period:'live',games:[],saved:[],compare:[],selected:null,query:'',results:[],loading:false,error:'',next:null,timer:null,searchRequest:0};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(Number(v)||0);
async function api(path){const r=await fetch(API+path);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function loadSaved(){try{const v=JSON.parse(localStorage.getItem('bobaks.watchlist')||'[]');if(Array.isArray(v))state.saved=[...new Set(v.map(String))].slice(0,25)}catch{state.saved=[]}}
function saveSaved(){try{localStorage.setItem('bobaks.watchlist',JSON.stringify(state.saved))}catch{}}
function nav(){ $('rankNav').classList.toggle('active',state.view==='home');$('savedNav').classList.toggle('active',state.view==='saved');$('savedCount').textContent=state.saved.length?'('+state.saved.length+')':'';$('compareNav').hidden=state.compare.length===0;$('compareNav').textContent='Compare ('+state.compare.length+')'}
function fallbackNext(){const n=Date.now(),step=600000;return new Date((Math.floor(n/step)+1)*step+15000).toISOString()}
function schedule(){if(state.timer)clearTimeout(state.timer);if(state.next)state.timer=setTimeout(loadRankings,Math.max(1000,new Date(state.next).getTime()-Date.now()))}
function movement(g){if(g.previousRank==null)return '<span class="new">NEW</span>';const d=Number(g.rankChange||0);if(d>0)return '<span class="up">▲ '+d+'</span>';if(d<0)return '<span class="down">▼ '+Math.abs(d)+'</span>';return '<span>•</span>'}
function icon(url){return url?'<img src="'+esc(url)+'" alt="">':'<div class="cover"></div>'}
async function loadRankings(){state.loading=true;state.error='';render();try{const p=await api('/api/rankings?period='+encodeURIComponent(state.period));state.games=(p.data||[]).map(x=>({rank:Number(x.rank),gameId:String(x.gameId),name:x.game?.name||'Unknown game',creator:x.game?.creatorName||'Unknown creator',icon:x.game?.iconUrl||'',playing:Number(x.score||0),previousRank:x.previousRank==null?null:Number(x.previousRank),rankChange:x.rankChange==null?null:Number(x.rankChange),calculatedAt:x.calculatedAt||null,placeId:Number(x.game?.placeId||0)}));state.next=p.nextCollectionAt||fallbackNext()}catch(e){state.games=[];state.next=null;state.error='Ranking data could not be loaded right now. Try again in a moment.'}finally{state.loading=false;render();schedule()}}
function renderSearchResults(){
  const el=document.querySelector('.results');
  if(!el)return;
  el.innerHTML=state.results.map(g=>'<button data-search-game="'+g.id+'"><b>'+esc(g.name)+'</b><br><small>'+esc(g.creator)+'</small></button>').join('');
  document.querySelectorAll('[data-search-game]').forEach(b=>b.onclick=()=>{state.results=[];openGame(b.dataset.searchGame)});
}
async function search(q){
  const query=q.trim();
  const requestId=++state.searchRequest;
  if(query.length<2){state.results=[];renderSearchResults();return}
  try{
    const p=await api('/api/search?q='+encodeURIComponent(query));
    if(requestId!==state.searchRequest || query!==state.query.trim())return;
    state.results=(p.data||[]).map(x=>({id:String(x.id),name:x.name,creator:x.creatorName||'Unknown creator'}));
    renderSearchResults();
  }catch{
    if(requestId!==state.searchRequest)return;
    state.results=[];
    renderSearchResults();
  }
}
function footer(){return '<footer class="foot"><div>Bobaks Ranking · Independent fan-made analytics site · Not affiliated with Roblox Corporation.</div><div><button data-info="methodology">How Rankings Work</button> <button data-info="privacy">Privacy</button> <button data-info="terms">Terms</button> <button data-info="sources">Data Sources</button></div></footer>'}
function home(){const tabs=periods.map(p=>'<button class="'+(state.period===p[0]?'active':'')+'" data-period="'+p[0]+'">'+p[1]+'</button>').join('');let rows='';if(state.loading&&!state.games.length)rows='<div class="empty">Loading rankings...</div>';else if(!state.games.length)rows='<div class="empty">No ranking data is available.</div>';else rows=state.games.map(g=>'<div class="row"><span class="rank">#'+g.rank+'</span><button class="game" data-game="'+g.gameId+'">'+icon(g.icon)+'<span><b>'+esc(g.name)+'</b><small>'+esc(g.creator)+'</small></span></button><span class="players"><b>'+fmt(g.playing)+'</b><small>'+(state.period==='live'?'players':'avg players')+'</small></span><span class="movement">'+movement(g)+'</span><span class="actions"><button class="mini" data-save="'+g.gameId+'">'+(state.saved.includes(g.gameId)?'Saved':'Save')+'</button><button class="mini" data-compare="'+g.gameId+'">'+(state.compare.includes(g.gameId)?'Compared':'Compare')+'</button></span></div>').join('');const result=state.results.map(g=>'<button data-search-game="'+g.id+'"><b>'+esc(g.name)+'</b><br><small>'+esc(g.creator)+'</small></button>').join('');return '<section class="hero"><div class="eyebrow">PLAYER COUNT TRACKER</div><h1>BOBAKS<br><em>RANKING</em></h1><p>Live rankings and historical trends for Roblox experiences.</p></section><div class="controls"><nav class="tabs">'+tabs+'</nav><button class="btn" id="refresh">↻ Refresh</button></div><div class="search"><input id="search" placeholder="Search a Roblox game, creator, or developer" value="'+esc(state.query)+'"><div class="results">'+result+'</div></div>'+(state.error?'<div class="banner error">'+esc(state.error)+'</div>':'')+'<div class="listhead"><div><h2>'+(state.period==='live'?'Top Games Right Now':periods.find(p=>p[0]===state.period)[1]+' Rankings')+'</h2><p>Ranked using Bobaks collected game-level data.</p></div><div class="updated">'+(state.next?'Next refresh '+new Date(state.next).toLocaleTimeString():'')+'</div></div><section class="rows">'+rows+'</section>'+footer()}
async function openGame(id){state.view='detail';state.selected={gameId:String(id),loading:true};render();try{const [g,h,p,rh]=await Promise.all([api('/api/games/'+encodeURIComponent(id)),api('/api/games/'+encodeURIComponent(id)+'/history?days=365'),api('/api/games/'+encodeURIComponent(id)+'/peak'),api('/api/games/'+encodeURIComponent(id)+'/rank-history?days=31')]);state.selected={...(g.data||{}),gameId:String(id),history:h.data||[],peak:Number(p.data?.peakPlayers||0),peakAt:p.data?.peakAt||null,rankHistory:rh.data||[],loading:false}}catch{state.selected={gameId:String(id),loading:false};state.error='That game could not be loaded.'}render()}
function daily(points){const m=new Map();for(const p of points||[]){const d=String(p.timestamp||p.date).slice(0,10);const v=Number(p.playerCount||p.averagePlayers||0);if(!m.has(d))m.set(d,[]);m.get(d).push(v)}return [...m].map(([date,a])=>({date,avg:a.reduce((x,y)=>x+y,0)/a.length})).sort((a,b)=>a.date.localeCompare(b.date))}
function chart(points,rankMode){const a=rankMode?(points||[]).map(x=>({date:x.date,avg:Number(x.rank)})):daily(points);if(a.length<2)return '<div class="empty">Not enough collected history yet.</div>';const vals=a.map(x=>x.avg),min=Math.min(...vals),max=Math.max(...vals),range=Math.max(1,max-min),w=900,h=190;const pts=a.map((x,i)=>((i/(a.length-1))*w).toFixed(1)+','+(h-8-((x.avg-min)/range)*(h-20)).toFixed(1)).join(' ');return '<div class="chart"><svg viewBox="0 0 '+w+' '+h+'"><line class="gridline" x1="0" y1="10" x2="900" y2="10"/><line class="gridline" x1="0" y1="95" x2="900" y2="95"/><line class="gridline" x1="0" y1="182" x2="900" y2="182"/><polyline class="'+(rankMode?'rankline':'line')+'" points="'+pts+'"/></svg></div>'}
function detail(){const g=state.selected;if(!g||g.loading)return '<div class="banner">Loading game details...</div>';const live=g.rankings?.live;const current=Number(g.currentPlayers||live?.score||0);const rank=live?.rank;return '<button class="btn" id="back">← Back</button><section class="detail-head"><img class="cover" src="'+esc(g.iconUrl||'')+'" alt=""><div><div class="eyebrow">GAME DETAILS</div><h1>'+esc(g.name||'Unknown game')+'</h1><p>by '+esc(g.creatorName||'Unknown creator')+'</p><div class="actions-wide"><a class="btn" target="_blank" rel="noreferrer" href="https://www.roblox.com/games/'+encodeURIComponent(g.placeId||0)+'">Open on Roblox ↗</a><button class="btn" data-save="'+g.gameId+'">'+(state.saved.includes(g.gameId)?'Saved':'Save game')+'</button><button class="btn" data-share="'+g.gameId+'">Share rank card</button><button class="btn" data-compare="'+g.gameId+'">Compare</button></div></div></section><section class="stats"><div class="stat"><span>Current Players</span><strong>'+fmt(current)+'</strong><small>latest qualifying snapshot</small></div><div class="stat"><span>Current Rank</span><strong>'+(rank?'#'+rank:'Not ranked')+'</strong><small>Live</small></div><div class="stat"><span>Recorded Peak</span><strong>'+fmt(g.peak)+'</strong><small>'+String(g.peakAt||'').slice(0,10)+'</small></div><div class="stat"><span>History</span><strong>'+fmt((g.history||[]).length)+'</strong><small>collected points</small></div></section><section class="panel"><h2>Player Count</h2><p>Collected history. Missing periods are not invented.</p>'+chart(g.history,false)+'</section><section class="panel"><h2>Rank History</h2><p>Daily rank from Bobaks collected history.</p>'+chart(g.rankHistory,true)+'</section><section class="panel"><h2>Game information</h2><div class="meta"><div><small>Universe ID</small><b>'+esc(g.universeId||'Not available')+'</b></div><div><small>Place ID</small><b>'+esc(g.placeId||'Not available')+'</b></div><div><small>Creator</small><b>'+esc(g.creatorName||'Unknown')+'</b></div><div><small>Recorded Peak</small><b>Highest count Bobaks has recorded</b></div></div></section>'}
async function savedPage(){const cards=[];for(const id of state.saved){try{const r=await api('/api/games/'+encodeURIComponent(id));if(r.data)cards.push(r.data)}catch{}}return '<section class="hero"><div class="eyebrow">YOUR SAVED GAMES</div><h1>SAVED<br><em>GAMES</em></h1><p>Saved only on this device. No account required.</p></section><section class="rows">'+(cards.length?cards.map(g=>'<div class="row"><span class="rank">•</span><button class="game" data-game="'+g.id+'">'+icon(g.iconUrl)+'<span><b>'+esc(g.name)+'</b><small>'+esc(g.creatorName||'Unknown creator')+'</small></span></button><span class="players"><b>Saved</b><small>this device</small></span><span></span><span class="actions"><button class="mini" data-save="'+g.id+'">Remove</button></span></div>').join(''):'<div class="empty">Nothing saved yet.</div>')+'</section>'+footer()}
async function comparePage(){if(!state.compare.length)return '<section class="hero"><div class="eyebrow">GAME COMPARISON</div><h1>COMPARE<br><em>GAMES</em></h1><p>Choose Compare on ranking rows to add games.</p></section>'+footer();const cards=[];for(const id of state.compare){try{const r=await api('/api/games/'+encodeURIComponent(id));if(r.data)cards.push(r.data)}catch{}}return '<section class="hero"><div class="eyebrow">GAME COMPARISON</div><h1>COMPARE<br><em>GAMES</em></h1></section><section class="compare">'+cards.map(g=>'<article class="panel"><h3>'+esc(g.name)+'</h3><p>'+esc(g.creatorName||'Unknown creator')+'</p><div class="stats"><div class="stat"><span>Players</span><strong>'+fmt(g.currentPlayers)+'</strong></div><div class="stat"><span>Live Rank</span><strong>'+(g.rankings?.live?.rank?'#'+g.rankings.live.rank:'N/A')+'</strong></div></div><button class="btn" data-game="'+g.id+'">Open game</button></article>').join('')+'</section>'+footer()}
function info(key){const data={privacy:['Privacy Policy','Bobaks Ranking focuses on game-level analytics. No player-level profiles are required for the public ranking experience.'],terms:['Terms of Use','Bobaks Ranking is an independent third-party analytics site. Player counts and rankings may change, be delayed, or become unavailable.'],sources:['Data Sources','Bobaks Ranking uses permitted public Roblox game-level data and calculates rankings from collected snapshots.']};if(key==='methodology')return '<section class="info"><button class="btn" id="back">← Back</button><h1>How Bobaks Rankings Work</h1><p>Rankings use qualifying Bobaks collection data. Live rankings require a recent qualifying snapshot. Weekly and monthly rankings use qualifying samples and the existing 50% coverage rule. Rank movement compares the current persisted ranking with the previous ranking set.</p><p>Recorded Peak means the highest player count Bobaks has recorded, not Roblox-wide all-time history.</p><p>Historical coverage depends on what Bobaks has successfully collected.</p></section>';const d=data[key]||data.privacy;return '<section class="info"><button class="btn" id="back">← Back</button><h1>'+d[0]+'</h1><p>'+d[1]+'</p><p>Contact: bobaksranking@gmail.com</p></section>'}
function render(){nav();if(state.view==='detail'){$('app').innerHTML=detail();bind();return}if(state.view==='saved'){$('app').innerHTML='<div class="banner">Loading saved games...</div>';savedPage().then(html=>{if(state.view==='saved'){$('app').innerHTML=html;bind()}});return}if(state.view==='compare'){$('app').innerHTML='<div class="banner">Loading comparison...</div>';comparePage().then(html=>{if(state.view==='compare'){$('app').innerHTML=html;bind()}});return}if(state.view==='info'){$('app').innerHTML=info(state.infoKey);bind();return}$('app').innerHTML=home();bind()}
function bind(){const q=$('search');if(q){q.oninput=e=>{state.query=e.target.value;clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>search(state.query),250)}}document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{state.period=b.dataset.period;loadRankings()});const r=$('refresh');if(r)r.onclick=loadRankings;const back=$('back');if(back)back.onclick=()=>{state.view='home';state.selected=null;state.error='';render();loadRankings()};document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>openGame(b.dataset.game));document.querySelectorAll('[data-search-game]').forEach(b=>b.onclick=()=>{state.results=[];openGame(b.dataset.searchGame)});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=String(b.dataset.save);state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):state.saved.length<25?[...state.saved,id]:state.saved;saveSaved();render()});document.querySelectorAll('[data-compare]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=String(b.dataset.compare);state.compare=state.compare.includes(id)?state.compare.filter(x=>x!==id):state.compare.length<2?[...state.compare,id]:state.compare;render()});document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>share(b.dataset.share));document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>{state.view='info';state.infoKey=b.dataset.info;render()})}
async function share(id){try{const r=await api('/api/games/'+encodeURIComponent(id));const g=r.data||{};const rank=g.rankings?.live?.rank?'#'+g.rankings.live.rank:'Not ranked';const text='Bobaks Ranking · '+g.name+' · '+rank+' · '+fmt(g.currentPlayers)+' players';if(navigator.share)await navigator.share({title:'Bobaks Rank Card',text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);state.error='Rank card text copied to clipboard.';render()}}catch{state.error='Sharing is unavailable right now.';render()}}
$('homeBtn').onclick=()=>{state.view='home';state.selected=null;render();loadRankings()};$('rankNav').onclick=()=>{state.view='home';render();loadRankings()};$('savedNav').onclick=()=>{state.view='saved';render()};$('compareNav').onclick=()=>{state.view='compare';render()};
loadSaved();render();loadRankings();
</script>
</body>
</html>
